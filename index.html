<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recreas Kampen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>S-Sport Recreas Kampen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: witte kop met woordmerk en kampkeuze, hoofdmenu met iconen (onderbalk op gsm), één werkkolom; formulieren in een schuifblad. Kleuren uit het S-Sport//Recreas-logo: rood, koraal, petrol. */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --surface2:#eef1f2; --line:#e2e6e8;
  --fg:#1c2226; --muted:#69737a;
  --orange:#da002f; /* merkrood S-Sport = accent */
  --coral:#f0859c; --teal:#078ea4; --purple:#8a6391; --red:#a8002a; --gold:#d98300; --ok:#078ea4;
  --glow:rgba(218,0,47,.08); --tealglow:rgba(8,166,189,.10); --purpleglow:rgba(138,99,145,.10);
  --onaccent:#ffffff;
  --display:"Montserrat","Avenir Next",system-ui,sans-serif;
  --body:"Nunito Sans","Avenir Next",system-ui,sans-serif;
  --mono:"Montserrat","Avenir Next",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(28,34,38,.05),0 4px 14px rgba(28,34,38,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1b1f23; --surface2:#242a2f; --line:#2f363c;
  --fg:#f1f4f5; --muted:#9aa4ab;
  --orange:#ff3b62; --coral:#f7a1b4; --teal:#2fc3d8; --purple:#b892bf; --red:#ff6f82; --gold:#f2aa45; --ok:#2fc3d8;
  --glow:rgba(255,59,98,.14); --tealglow:rgba(47,195,216,.12); --purpleglow:rgba(184,146,191,.14); --onaccent:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1b1f23; --surface2:#242a2f; --line:#2f363c;
  --fg:#f1f4f5; --muted:#9aa4ab;
  --orange:#ff3b62; --coral:#f7a1b4; --teal:#2fc3d8; --purple:#b892bf; --red:#ff6f82; --gold:#f2aa45; --ok:#2fc3d8;
  --glow:rgba(255,59,98,.14); --tealglow:rgba(47,195,216,.12); --purpleglow:rgba(184,146,191,.14); --onaccent:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* kop */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.mark{width:38px;height:38px;flex:none}
.brand h1{font-size:clamp(20px,4.6vw,28px)}
.brand h1 span{color:var(--orange)}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.brand .grow{flex:1;min-width:0}
.sync{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.savebtn{display:inline-flex;align-items:center;gap:6px;margin-left:auto;flex:none}.savebtn .ico{width:16px;height:16px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--red)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px;padding:7px 12px;border-radius:999px;border:1px solid transparent}
nav.tabs a:hover{color:var(--fg);border-color:var(--line)}
nav.tabs a[aria-current="page"]{background:var(--fg);color:var(--bg)}

main{padding-block:20px 80px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:clamp(30px,7vw,46px);flex:1;min-width:0}
.head h2 em{font-style:normal;color:var(--orange)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--onaccent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.banner{border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:14px}
.banner p{margin:0;flex:1;min-width:200px}

.search{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}

/* kaarten */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;width:100%}
button.card:hover{border-color:var(--muted)}
.card .t{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;overflow-wrap:anywhere}
.card .m{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.card .row{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--fg);white-space:nowrap}
.chip.o{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.chip.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.chip.g{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.chip.k{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);text-transform:uppercase;font-size:22px;margin-bottom:4px}
.group{margin-top:22px}
.group>.lbl{display:block;margin-bottom:8px}

/* overzicht */
.hero{border:1px solid var(--line);border-radius:18px;padding:22px;background:radial-gradient(120% 140% at 100% 0%,var(--glow),transparent 60%),var(--surface);display:grid;gap:14px}
.hero h2{font-size:clamp(34px,8vw,60px)}
.hero .when{font-family:var(--mono);font-size:13px;color:var(--muted)}
.count{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;color:var(--orange)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin-top:4px}
.stat .v small{font-size:16px;color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.panel h3{font-size:20px;margin-bottom:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline;min-width:0}
.li:first-child{border-top:0}
.li .tm{font-family:var(--mono);font-size:12px;color:var(--muted);width:46px;flex:none}
.li .x{flex:1;min-width:0;overflow-wrap:anywhere}
.li .x small{display:block;color:var(--muted);font-size:13px}

/* dagplanning */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:center;min-width:64px}
.day .d{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.day .w{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day[aria-pressed="true"] .w{color:var(--bg)}
.tl{display:flex;flex-direction:column;gap:8px}
.mdays{display:flex;flex-direction:column;gap:12px}
.mday{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px}
.mdh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mslots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:720px){.mslots{grid-template-columns:1fr 1fr}}
.mcel{border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcel.vol{border-style:solid;border-left:4px solid var(--ok)}
.mitem{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}.mitem b{overflow-wrap:anywhere}.mitem small{color:var(--muted);font-size:12px}
.mitem:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
.mcel.td{background:color-mix(in srgb,var(--gold) 7%,transparent)}
.tdmove{display:flex;gap:4px;flex-wrap:wrap}.tdmove .btn{padding:2px 8px;font-size:12px}
.madd{font-size:13px;color:var(--muted)}
.dagschema{display:flex;flex-direction:column;gap:10px}
.blok{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.blokh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.blokh h4{margin:0;font-size:16px;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.blokh h4 .lbl{font-weight:600;margin-left:6px}
.blok.douche{border:2px dashed var(--teal);background:color-mix(in srgb,var(--teal) 8%,var(--surface))}.blok.douche h4{color:var(--teal)}
.tli{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:stretch;text-align:left;background:none;border:0;padding:0;width:100%}
.tli .tm{font-family:var(--mono);font-size:13px;padding-top:12px;color:var(--muted)}
.tli .bx{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:10px 12px;min-width:0}
.tli:hover .bx{border-color:var(--muted)}
.tli .bx .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tli .bx .n{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.tli .bx .s{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.tli.rit .bx{border-left-color:var(--orange)}
.tli.act .bx{border-left-color:var(--gold)}
.tli.eet .bx{border-left-color:var(--ok)}
.tli.pln .bx{border-left-color:var(--fg)}

/* kamers */
.room .beds{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.bed{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:8px;padding:6px 8px;min-width:0}
.bed span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed.free{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.bed select{max-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:13px}
.full{color:var(--ok)} .over{color:var(--red)}

/* boekhouding */
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:6px 0}
.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.tx:hover .amt{color:var(--orange)}
.tx .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
.amt{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--ok)}
.pos{color:var(--ok)} .neg{color:var(--red)}

/* rekeningen */
.scan{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px dashed color-mix(in srgb,var(--orange) 60%,transparent);border-radius:16px;padding:18px;margin-bottom:16px;background:color-mix(in srgb,var(--orange) 6%,var(--surface))}
.scan p{margin:0;flex:1;min-width:220px;color:var(--muted)}
.bons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bon{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.bon .img{aspect-ratio:3/4;max-width:100%;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.bon .img img{width:100%;height:100%;object-fit:cover}
.bon .c{padding:8px 10px}
.bon .c div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--muted)}

/* schuifblad */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:30px}
.sheet .bar2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card.lid{display:flex;flex-direction:column;gap:8px;cursor:default}
.lidnaam{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px}.lidnaam:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:6px}
.lidnaam .m{color:var(--muted);font-size:13px}
.ledtools{margin-bottom:14px}.ledtools summary{cursor:pointer;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.ledtools textarea{width:100%;min-height:120px;margin:8px 0}
.medsec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.medhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.medhead h4{margin:0;font-size:16px}
#medsBox{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.medrow{width:100%;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:12px;padding:10px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}
.medrowh{display:flex;justify-content:space-between;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--orange);outline:none}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo img{width:96px;height:128px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.photo .pdf{width:96px;height:128px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted)}
.ai{font-size:13px;color:var(--gold)}
.lightbox img{max-width:100%;border-radius:12px;border:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
/* kampkeuze */
.kamprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:8px}
.kampsel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:15px;max-width:100%;min-width:0}
/* kalender */
.calnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.calnav h3{font-size:26px;flex:1;min-width:160px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cd{min-height:92px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0}
.cd:hover{border-color:var(--muted)}
.cd.out{opacity:.38}
.cd.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.cd .dn{font-family:var(--display);font-weight:800;font-size:18px;line-height:1;display:flex;justify-content:space-between;align-items:center}
.cd .dot{width:7px;height:7px;border-radius:50%;background:var(--fg)}
.kb{height:6px;border-radius:3px;flex:none}
.ev{font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface2);border-radius:4px;padding:1px 4px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
@media (max-width:560px){.cd{min-height:58px;padding:4px}.cd .dn{font-size:15px}.ev{font-size:0;height:4px;padding:0;background:var(--muted)}}
.tli.cal .bx{border-left-color:var(--red)}
/* welkom */
.welcome{padding-block:6px 14px;display:grid;gap:8px}
.welcome h2{font-size:clamp(40px,10vw,72px)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.kcard:hover{border-color:var(--muted)}

.kcard .t{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.kcard .m{color:var(--muted);font-size:14px}
.kcard.new{border-style:dashed;justify-content:center;align-items:flex-start}
.kcard.new .t{color:var(--orange)}
.kdot{width:12px;height:12px;border-radius:50%;display:inline-block;align-self:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px;margin-top:14px}
.tile{display:flex;flex-direction:column;gap:2px;justify-content:space-between;min-height:104px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg);min-width:0}
.tile:hover{border-color:var(--orange)}
.tile .c{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--orange)}
.tile .n{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.tile .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.btn{text-decoration:none;color:var(--fg)}
/* submenu */
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;margin-top:-2px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs a{flex:none;text-decoration:none;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:8px;border:1px solid transparent}
.subtabs a:hover{color:var(--fg)}
.subtabs a[aria-current="page"]{color:var(--fg);background:var(--surface2);border-color:var(--line)}
.home{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;flex:1;min-width:0}
nav.tabs a.hometab{font-size:18px;padding:5px 11px}
.mains{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:22px}
.main{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.mainhead{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end;padding:18px 18px 14px;text-decoration:none;color:var(--fg);background:radial-gradient(120% 160% at 100% 0%,var(--glow),transparent 65%)}
.mainhead:hover .n,.mainhead:hover .arrow{color:var(--orange)}
.mainhead .n{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,42px);text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.mainhead .arrow{font-family:var(--display);font-weight:800;font-size:30px;grid-row:1/3;grid-column:2;align-self:center;color:var(--muted)}
.mainhead .c{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.mainsubs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mainsubs a{display:flex;justify-content:space-between;gap:10px;padding:10px 18px;text-decoration:none;color:var(--fg);border-top:1px solid var(--line);font-weight:500}
.mainsubs a:first-child{border-top:0}
.mainsubs a:hover{background:var(--surface2);color:var(--orange)}
.mainsubs b{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:600}
/* verdeling */
.multi{display:flex;flex-wrap:wrap;gap:6px}
.mdagen{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.mdag{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.mdag b{font-size:22px;color:var(--teal)}.mdag small{color:var(--muted);font-size:12px;line-height:1.3}
.mondag{margin:0 0 10px}
.fld[hidden]{display:none!important}
.mchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--surface);cursor:pointer;font-size:14px}
.mchip:has(input:checked){border-color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,var(--surface))}
table.vt{width:100%;border-collapse:collapse;min-width:420px}
.vt th,.vt td{padding:7px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
.vt th{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.1em;border-top:0}
.vt td .chip{display:inline-block;margin:2px 2px 2px 0}
.linkbtn{background:none;border:0;padding:0;font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkbtn.on{color:var(--orange)}
/* balans */
table.bal{min-width:520px}
.bal tr.ghead th{font-family:var(--display);font-weight:800;font-size:18px;color:var(--orange);letter-spacing:.03em;padding-top:16px;border-top:0}
.bal tr.gsub td{font-weight:700;border-top:2px solid var(--line)}
.bal tr.gtot td{font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;border-top:2px solid var(--fg)}
.bal tr.idle td{color:var(--muted)}
.bal td:nth-child(n+2),.bal th:nth-child(n+2){text-align:right;white-space:nowrap}
.prijsrow{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--muted);font-size:13px;white-space:nowrap}
.prijs{width:84px;text-align:right;background:var(--bg);border:1px solid var(--orange);border-radius:8px;padding:5px 8px;color:var(--fg);font-size:14px}
.bud{width:100px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.bud:focus{border-color:var(--orange);outline:none}
.catopen{color:var(--fg);cursor:pointer}.catopen:hover{text-decoration-color:var(--orange)}
.catopen .cnt{font-family:var(--display);font-size:11px;font-weight:700;background:var(--surface2);border-radius:999px;padding:1px 7px;color:var(--muted);text-decoration:none;display:inline-block}
.photo.need{outline:2px solid var(--red);outline-offset:4px;border-radius:12px}
.pdot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--pc);margin-right:7px;vertical-align:.05em;flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 25%,transparent)}
.pdot.big{width:14px;height:14px}
.ptxt{font-family:var(--display);font-size:11px;font-weight:600;color:var(--muted)}
.card.ploeg{border-top:5px solid var(--pc)}
.catbons{margin:4px 0 8px}
.delcat{color:var(--red);text-decoration:none;font-size:16px;margin-left:4px}
.delcat.armed{font-size:12px}
.addcat{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
/* media & blog */
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;border-radius:12px;overflow:hidden}
.gal.one{grid-template-columns:1fr}
.gal a,.gal video{display:block;min-width:0}
.gal img,.gal video{width:100%;height:100%;aspect-ratio:1;object-fit:cover;background:var(--surface2);border-radius:0;max-height:none}
.gal.one img,.gal.one video{aspect-ratio:auto;max-height:520px}
.post .gal img{max-height:none;border-radius:0}
.mthumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mthumb{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover}
.mthumb .vtag{position:absolute;left:4px;bottom:4px;font-family:var(--mono);font-size:10px;background:var(--bg);color:var(--fg);padding:1px 4px;border-radius:4px}
.mrm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bg);color:var(--fg);font-size:16px;line-height:1}
.mediabox{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.reacts{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.react{font-size:14px;overflow-wrap:anywhere}
.reactForm{display:flex;gap:6px}
.reactForm input{max-width:none;flex:1;min-width:0}
/* chat */
.chat{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);height:min(72vh,720px)}
.glist{border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.gitem{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);min-width:0}
.gitem .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.gitem.on{background:var(--surface2);box-shadow:inset 3px 0 0 var(--orange)}
.gname{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv{display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.backbtn{display:none}
.wapanel{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;max-height:45%;overflow-y:auto;background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.btn.wa{background:var(--ok);border-color:var(--ok);color:var(--onaccent)}
.wal .li{align-items:center}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.daysep{align-self:center;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 0}
.msg{max-width:min(78%,460px);align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--orange) 20%,var(--surface));border-color:color-mix(in srgb,var(--orange) 40%,var(--line));border-radius:14px 14px 4px 14px}
.msg .from{font-size:12px;font-weight:600;color:var(--orange)}
.msg .mt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .mtime{font-family:var(--mono);font-size:10px;color:var(--muted);align-self:flex-end}
.msg .gal{border-radius:8px}
.cform{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);align-items:center}
.cform input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 14px}
@media (max-width:720px){
  .chat{grid-template-columns:1fr;height:min(78vh,760px)}
  .glist{border-right:0}
  .chat.open .glist{display:none}
  .chat:not(.open) .conv{display:none}
  .backbtn{display:inline-flex}
}

.post>img{width:100%;max-height:520px;object-fit:cover;border-radius:12px}

.lwrap .lacts{margin-top:6px}

/* ===== S-Sport//Recreas-stijl: strakker, lichter, vriendelijker ===== */
body{font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.005em;line-height:1.1}
.lbl{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.1em}
.ico{width:22px;height:22px;flex:none}

/* kop */
header.top{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
body::before{background:var(--surface)}
.brand{padding-block:12px 6px}
.wm{font-family:var(--display);font-weight:600;font-size:clamp(19px,4.4vw,25px);letter-spacing:.01em;text-transform:uppercase;color:var(--orange);line-height:1;white-space:nowrap}
.wm span{color:var(--orange)}
.dots{display:grid;grid-template-columns:repeat(2,13px);gap:3px 4px;transform:skewX(-12deg);flex:none}
.dots i{width:13px;height:11px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--orange);transform:translateY(3px)}.dots i:nth-child(2){background:var(--coral)}.dots i:nth-child(3){background:var(--teal);transform:translateY(3px)}.dots i:nth-child(4){background:var(--purple)}
.wm i{font-style:normal;color:var(--coral);font-weight:500;letter-spacing:-.12em;margin:0 .14em 0 .02em}
.tag{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-top:4px}
.sync{font-family:var(--display);font-weight:600;font-size:10px}
.kamprow{padding-bottom:10px}
.kampsel{font-family:var(--display);font-weight:700;text-transform:none;font-size:14px;border-radius:999px;padding:7px 14px;background:var(--surface2);border-color:transparent}
#tripSub{font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.02em;text-transform:none;color:var(--muted)}

/* hoofdmenu */
nav.tabs{gap:6px;padding-bottom:10px}
nav.tabs a{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:13.5px;letter-spacing:.01em;text-transform:none;padding:8px 14px;border-radius:12px;color:var(--muted);border:1px solid transparent}
nav.tabs a .ico{width:19px;height:19px}

nav.tabs a[aria-current="page"]{background:var(--orange);color:var(--onaccent)}
nav.tabs a.hometab{font-size:13.5px;padding:8px 14px}
.subtabs{gap:6px;padding-bottom:12px}
.subtabs a{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:0;text-transform:none;padding:6px 13px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid transparent}
.subtabs a:hover{color:var(--fg)}
.subtabs a[aria-current="page"]{background:var(--tealglow);color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,transparent)}

/* onderbalk op gsm */
@media (max-width:720px){
  header.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface)}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;gap:0;justify-content:space-around;overflow:visible;
    background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}

.welcome .lbl{color:var(--teal)}
.kgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.kcard{border-width:1.5px}
.kcard.sel{border-color:var(--orange);box-shadow:0 0 0 3px var(--glow),var(--shadow)}
.kcard.new{box-shadow:none;background:transparent;border:1.5px dashed var(--line)}
.kcard.new .t{color:var(--orange)}
.mains{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.main{border-radius:20px;border:1px solid var(--line)}
.mainhead{grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:2px 14px;align-items:center;padding:18px;background:none}
.micon{grid-row:1/3;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--glow);color:var(--orange)}
.micon .ico{width:26px;height:26px}
.m-monitoren .micon,.m-boekhouding .micon{background:var(--tealglow);color:var(--teal)}
.m-kalender .micon,.m-socials .micon,.m-algvergaderingen .micon{background:var(--purpleglow);color:var(--purple)}
.mainhead .n{font-size:20px;text-transform:none;letter-spacing:-.005em;line-height:1.1;grid-column:2}
.mainhead .c{font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0;grid-column:2}
.mainhead .arrow{grid-column:3;grid-row:1/3;font-family:var(--display);font-size:28px;font-weight:500;color:var(--line)}
.mainhead:hover .arrow{color:var(--orange)}
.mainhead:hover .n{color:var(--fg)}
.mainsubs a{padding:11px 18px;font-weight:600}
.mainsubs a:hover{color:var(--orange);background:var(--surface2)}
.mainsubs b{font-family:var(--display);font-size:11px;min-width:24px;text-align:center;background:var(--surface2);border-radius:999px;padding:2px 8px;color:var(--muted)}
.hero{border-radius:20px;background:radial-gradient(120% 140% at 100% 0%,var(--tealglow),transparent 60%),var(--surface);box-shadow:var(--shadow)}
.hero h2{font-size:clamp(24px,6vw,38px);text-transform:none}
.hero .when{font-family:var(--body);font-size:14px}
.count{font-family:var(--display);font-size:18px;text-transform:none;color:var(--teal)}

/* dagplanning en kalender */
.day{border-radius:14px}
.day .d{font-family:var(--display);font-size:20px}
.day[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--onaccent)}
.day[aria-pressed="true"] .w{color:var(--onaccent)}
.tli .bx{border-radius:14px;box-shadow:var(--shadow)}
.tli .bx .n{font-family:var(--display);font-weight:700;font-size:16px;text-transform:none}
.tli.act .bx{border-left-color:var(--teal)}
.tli.eet .bx{border-left-color:var(--gold)}
.calnav h3{font-size:20px;text-transform:none}
.cd{border-radius:12px}
.cd .dn{font-family:var(--display);font-size:14px;font-weight:700}
.cd.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.gname{font-family:var(--display);font-weight:700;font-size:15px;text-transform:none}

/* blog, balans */
.post h3{font-size:20px;text-transform:none}
.bal tr.ghead th{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal)}
.bal tr.gtot td{font-size:14px;text-transform:none;border-top:2px solid var(--fg)}
.msg.me{background:var(--glow);border-color:color-mix(in srgb,var(--orange) 30%,var(--line))}
.msg .from{color:var(--teal)}
.sheet h3{font-size:22px;text-transform:none}
.fld input,.fld select,.fld textarea{border-radius:12px;background:var(--surface)}
.sheet{background:var(--bg)}
.toast{border-radius:12px;font-family:var(--display);font-weight:600;font-size:14px}
/* capaciteit */
.capbar{margin-bottom:12px}
.linkchip{border:1px dashed var(--line);background:transparent;cursor:pointer;color:var(--orange)}
.card.inactief{opacity:.7}
/* contacten */
.ccard .telnr{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;user-select:all;color:var(--fg)}
.ccard.vast{border-left:4px solid var(--teal)}
.ccard.nood{border-left-color:var(--orange);background:linear-gradient(90deg,var(--glow),transparent 60%),var(--surface)}
.ccard.leeg{border:1.5px dashed var(--line);box-shadow:none;background:transparent;align-items:flex-start}
.ccard.leeg .t{color:var(--orange)}
.ccard .btn.primary{color:var(--onaccent)}
</style>

async function makeBackup(){
  toast('Alles wordt opgeslagen…');
  const media={};try{for(const [k,blob] of await idbAll('media'))media[k]=await blobToDataURL(blob)}catch(e){}
  // in de gedeelde versie staan foto's online: haal ze op en stop ze mee in het bestand
  const kopie=JSON.parse(JSON.stringify(data));let mis=0;const gezien={};
  const walk=async o=>{if(!o||typeof o!=='object')return;if(Array.isArray(o)){for(const x of o)await walk(x);return}
    if(typeof o.url==='string'&&o.id&&!o.idb){const key='a'+String(o.id).replace(/[^\w-]/g,'');
      try{if(!gezien[key]){const b=await (await fetch(o.url)).blob();media[key]=await blobToDataURL(b);gezien[key]=1}o.idb=key;o.type=o.type||'';delete o.url;delete o.id}catch(e){mis++}return}
    for(const v of Object.values(o))await walk(v)};
  if(mode!=='lokaal')await walk(kopie);
  const blob=new Blob([JSON.stringify({app:'recreas-kampen',versie:1,gemaakt:new Date().toISOString(),data:kopie,media})],{type:'application/json'});
  const nu=new Date(),fn='recreas-kampen-'+iso(nu)+'-'+String(nu.getHours()).padStart(2,'0')+'u'+String(nu.getMinutes()).padStart(2,'0')+'.json';
  if(downloads){try{await downloads.save({filename:fn,data:blob})}catch(e){if(e&&e.code==='declined')return;toast('Opslaan lukte niet');return}}else saveFile(fn,blob);
  lastBackup=Date.now();idbDo('kv','readwrite',st=>st.put(lastBackup,'backup')).catch(()=>{});render();
  setTimeout(()=>toast('Opgeslagen als '+fn+' (map Downloads)'+(mis?' · '+mis+' foto(\'s) niet meegekomen':'')),300);
}

  const base=id?{...get(col,id)}:{aangemaakt:Date.now()};delete base.id;
  const obj={...base,...vals,gewijzigd:Date.now()};
  if(!id&&SCOPED.includes(col)&&!vals.kamp)obj.kamp=curKamp;

  lsSet();render();return id;
}

async function delRec(col,id){

async function startLocal(){
  if(mode!=='laden')return;mode='lokaal-laden';
  let s=null;try{s=await idbDo('kv','readonly',st=>st.get('data'))}catch(e){}
  if(!s)s=lsGet();
  try{for(const [k,blob] of await idbAll('media'))MEDIA[k]=URL.createObjectURL(blob)}catch(e){}
  try{lastBackup=(await idbDo('kv','readonly',st=>st.get('backup')))||0}catch(e){}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  mode='laden';startLocalSync(s);
}
function startLocalSync(s){
  if(mode!=='laden')return;
  mode='lokaal';
  if(s&&s.data)COLS.forEach(c=>data[c]=s.data[c]||[]);
  setSync(STANDALONE?'ok':'err',STANDALONE?'Op dit toestel':'Alleen dit toestel');render();
}
async function boot(){
  render();
  const c=window.claude;
  if(!c||typeof c.use!=='function'){startLocal();return}
  const timer=setTimeout(()=>startLocal(),10000);
  try{db=await c.use('db')}catch(e){db=null}
  if(!db){clearTimeout(timer);startLocal();return}
  if(mode!=='laden')return;
  mode='db';
  const pending=new Set(COLS);
  const done=k=>{if(pending.delete(k)&&!pending.size){clearTimeout(timer);setSync('ok','Gedeeld')}};
  const onErr=e=>{clearTimeout(timer);setSync('err',e&&e.code==='not_granted'?'Geen toegang':'Verbinding weg')};
  COLS.forEach(col=>db.collection(col).onSnapshot(s=>{data[col]=s.docs.map(d=>({id:d.id,...d.data()}));done(col);scheduleRender()},onErr));
  c.use('assets').then(a=>{assets=a;scheduleRender()}).catch(()=>{});
  c.use('user').then(async u=>{if(!u)return;userApi=u;try{myId=(await u.id())||'lokaal'}catch(e){}scheduleRender()}).catch(()=>{});
  c.use('sample').then(s=>{sampleFn=s}).catch(()=>{});
  c.use('downloads').then(d=>{downloads=d}).catch(()=>{});
}

async function addLeden(names){const have=new Set(data.leden.map(l=>normN(l.naam)));let n=0,dub=0;
  for(const nm of names){if(have.has(normN(nm))){dub++;continue}have.add(normN(nm));await saveRec('leden',null,{naam:nm});n++}
  toast(n+' toegevoegd'+(dub?' · '+dub+' stonden er al':''))}
function route(){const h=location.hash.slice(1);view=TABS.some(t=>t[0]===h)?h:'overzicht';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

/* ---------- dagen ---------- */
function tripDays(){
  const k=K();const s=pd(k.start),e=pd(k.eind||k.start);const out=[];
  if(s&&e&&e>=s){for(let d=new Date(s);d<=e&&out.length<60;d.setDate(d.getDate()+1))out.push(iso(d))}
  const extra=new Set();['ritten','planning','activiteiten','maaltijden'].forEach(c=>cur(c).forEach(r=>r.datum&&extra.add(r.datum)));
  extra.forEach(d=>{if(!out.includes(d))out.push(d)});
  return out.sort();
}
function dayItems(d){
  const it=[];
  cur('ritten').filter(r=>r.datum===d).forEach(r=>it.push({c:'rit',col:'ritten',id:r.id,t:r.vertrek||'',k:'Fietsrit'+(r.niveau?' · '+r.niveau:''),n:r.naam,s:[r.start&&r.aankomst?r.start+' → '+r.aankomst:(r.start||r.aankomst||''),r.km?r.km+' km':'',r.hoogte?r.hoogte+' hm':''].filter(Boolean).join(' · ')}));
  cur('activiteiten').filter(r=>r.datum===d).forEach(r=>it.push({c:'act',col:'activiteiten',id:r.id,b:r.blok,t:r.uur||'',k:'Activiteit'+(r.reservatie?' · '+r.reservatie:''),n:r.naam,s:[r.plaats,(r.begeleiding||[]).length?'Begeleiding: '+(r.begeleiding||[]).map(id=>nameOf('monitoren',id)).filter(Boolean).join(', '):'',r.kost?eur(r.kost)+' p.p.':''].filter(Boolean).join(' · ')}));
  cur('maaltijden').filter(r=>r.datum===d).forEach(r=>it.push({c:'eet',col:'maaltijden',id:r.id,b:mealSlot(r.moment)==='Tussendoortje'?TD_BLOK[tdPos(d)]:mealSlot(r.moment),t:r.uur||(mealSlot(r.moment)==='Tussendoortje'?TD_UUR[tdPos(d)]:MEAL_TIME[r.moment])||'',k:'Maaltijd',n:r.moment+(r.waar?' · '+r.waar:''),s:[r.menu,r.wie?'Zorgt: '+r.wie:''].filter(Boolean).join(' · ')}));
  cur('planning').filter(r=>r.datum===d).forEach(r=>it.push({c:'pln',col:'planning',id:r.id,b:r.blok,t:r.van||'',k:'Planning'+(r.tot?' · tot '+r.tot:''),n:r.wat,s:[r.waar,r.wie].filter(Boolean).join(' · ')}));
  data.kalender.filter(r=>r.kamp===curKamp&&r.datum<=d&&(r.tot||r.datum)>=d).forEach(r=>it.push({c:'cal',col:'kalender',id:r.id,t:r.uur||'',k:'Kalender'+(r.soort?' · '+r.soort:''),n:r.titel,s:r.notities||''}));
  return it.sort((a,b)=>(a.t||'99').localeCompare(b.t||'99'));
}
const BLOKKEN=[['Ontbijt','07:30','Ontbijt'],['Voormiddag','09:00',''],['Middagmaal','12:00','Middagmaal'],['Namiddag','13:30',''],['Avondmaal','18:00','Avondmaal'],['Avondactiviteit','19:30','']];
const DOUCHE_STD=4;
function blokVan(i){if(i.b&&BLOKKEN.some(x=>x[0]===i.b))return i.b;const t=i.t||'';if(!t)return '';
  return t<'09:00'?'Ontbijt':t<'12:00'?'Voormiddag':t<'13:30'?'Middagmaal':t<'18:00'?'Namiddag':t<'19:30'?'Avondmaal':'Avondactiviteit'}
const douchePos=d=>{const k=K();const v=k.douche&&k.douche[d];return v!=null&&v!==''?+v:(k.doucheStd!=null&&k.doucheStd!==''?+k.doucheStd:DOUCHE_STD)};
const tliHTML=i=>`<button class="tli ${i.c}" data-edit="${i.col}" data-id="${esc(i.id)}"><div class="tm num">${esc(i.t||'—')}</div><div class="bx"><div class="k">${esc(i.k)}</div><div class="n">${esc(i.n)}</div>${i.s?`<div class="s">${esc(i.s)}</div>`:''}</div></button>`;
function dagSchema(d){
  const it=dayItems(d);const per={};it.forEach(i=>{const b=blokVan(i);(per[b]=per[b]||[]).push(i)});
  const pos=douchePos(d);const gs=cur('ploegen').sort(byName);
  const douche=`<div class="blok douche"><div class="blokh"><h4>🚿 Douchemoment</h4><div class="row" style="gap:4px"><button class="btn small" data-douche="up" ${pos<=0?'disabled':''} aria-label="Douchemoment vroeger">▲</button><button class="btn small" data-douche="down" ${pos>=BLOKKEN.length?'disabled':''} aria-label="Douchemoment later">▼</button><button class="btn small" data-douche="all" title="Zet het douchemoment op deze plek voor elke dag">Elke dag hier</button></div></div>
    <p class="hint" style="margin:0">${pos===0?'Voor het ontbijt':pos>=BLOKKEN.length?'Na de avondactiviteit':'Na '+BLOKKEN[pos-1][0].toLowerCase()}. Verplaats met ▲ ▼.</p>${gs.length?`<div class="row" style="gap:6px">${gs.map(g=>`<span class="chip" style="background:color-mix(in srgb,${kleurHex(g.kleur)||'var(--muted)'} 18%,transparent)">${pTag({ploeg:g.id})}${esc(g.naam)}</span>`).join('')}</div>`:''}</div>`;
  const blok=([n,tijd,moment],i)=>{const items=per[n]||[];
    return `<div class="blok"><div class="blokh"><h4>${esc(n)} <span class="lbl">${tijd}</span></h4><button class="btn small" data-new="${moment?'maaltijden':'planning'}" data-date="${d}" ${moment?`data-moment="${moment}"`:`data-blok="${n}"`}>+ ${moment?'maaltijd':'toevoegen'}</button></div>${items.length?`<div class="tl">${items.map(tliHTML).join('')}</div>`:`<p class="hint" style="margin:0">Nog niets gepland.</p>`}</div>`};
  let h=monDag(d);if(per['']&&per[''].length)h+=`<div class="blok"><div class="blokh"><h4>Zonder uur of dagdeel</h4></div><div class="tl">${per[''].map(tliHTML).join('')}</div></div>`;
  BLOKKEN.forEach((b,i)=>{if(i===pos)h+=douche;h+=blok(b,i)});if(pos>=BLOKKEN.length)h+=douche;
  return `<div class="dagschema">${h}</div>`;
}
function kampDagen(){const k=K();const s=pd(k.start),e=pd(k.eind||k.start);const out=[];if(s&&e&&e>=s)for(let d=new Date(s);d<=e&&out.length<60;d.setDate(d.getDate()+1))out.push(iso(d));return out}
const deelsMee=r=>r.aanwezig==='Enkele dagen';
const monMee=(r,d)=>!deelsMee(r)||(Array.isArray(r.dagen)&&r.dagen.includes(d));
function monAanw(r){if(deelsMee(r)){const ds=(Array.isArray(r.dagen)?r.dagen:[]).slice().sort();return ds.length?ds.map(fd).join(', '):'Dagen nog niet aangeduid'}return r.aanwezig||r.beschikbaar||''}
function monDag(d){const m=cur('monitoren');if(!m.length)return '';const mee=m.filter(r=>monMee(r,d)).sort(byName);
  return `<p class="hint mondag"><b>Monitoren ${mee.length} / ${m.length}:</b> ${mee.length?esc(mee.map(r=>r.naam).join(', ')):'niemand aanwezig'}</p>`}
function syncDagen(){const s=$('#f_aanwezig'),b=$('#fld_dagen');if(s&&b)b.hidden=s.value!=='Enkele dagen'}
function timeline(d){
  const it=dayItems(d);const md=monDag(d);
  if(!it.length)return md+`<div class="empty"><b>Nog niets gepland</b>Voeg een activiteit, maaltijd of planningsitem toe voor ${esc(fdl(d))}.</div>`;
  return md+`<div class="tl">${it.map(i=>`<button class="tli ${i.c}" data-edit="${i.col}" data-id="${esc(i.id)}"><div class="tm num">${esc(i.t||'—')}</div><div class="bx"><div class="k">${esc(i.k)}</div><div class="n">${esc(i.n)}</div>${i.s?`<div class="s">${esc(i.s)}</div>`:''}</div></button>`).join('')}</div>`;
}
function money(){
  const bk=cur('boekhouding');
  const uit=bk.filter(r=>r.soort!=='Inkomst').reduce((s,r)=>s+num(r.bedrag),0);
  const inn=bk.filter(r=>r.soort==='Inkomst').reduce((s,r)=>s+num(r.bedrag),0);
  const dl=cur('deelnemers').filter(actief);const bijdr=dl.reduce((s,r)=>s+num(r.betaald),0);
  const verwacht=num(K().bijdrage)*dl.length;
  return {uit,inn,bijdr,verwacht,nDeel:dl.length,saldo:bijdr+inn-uit};
}
const header=(title,col,extra='')=>`<div class="head"><h2>${title}</h2>${extra}${col?`<button class="btn primary" data-new="${col}">+ ${esc(SCHEMA[col].one)}</button>`:''}</div>`;
const empty=(t,s,btn='')=>`<div class="empty"><b>${esc(t)}</b>${esc(s)}${btn?`<div style="margin-top:12px">${btn}</div>`:''}</div>`;
function copyBar(col){
  const others=data.kampen.filter(k=>k.id!==curKamp&&data[col].some(r=>r.kamp===k.id));
  if(!others.length)return '';
  return `<div class="banner" style="border-color:var(--line);background:var(--surface)"><p>Dezelfde ${col==='monitoren'?'monitoren':'deelnemers'} als bij een ander kamp? Neem ze over (zonder kamer en betaling).</p><select class="kampsel" id="copyFrom" aria-label="Kamp om van over te nemen">${others.map(k=>`<option value="${esc(k.id)}">${esc(k.naam)}</option>`).join('')}</select><button class="btn small" data-copycol="${col}">Neem over</button></div>`;
}

function render(){
  if(mode!=='laden')pickKamp();
  const k=K();const fiets=showFiets();
  const grp=MENU.find(g=>g[0]===view||g[2].some(s=>s[0]===view))||null;
  $('#tabs').innerHTML=`<a href="#overzicht" class="hometab" ${view==='overzicht'?'aria-current="page"':''}>${ico('home')}<span>Start</span></a>`+MENU.map(g=>`<a href="#${(g[2].find(s=>!s[2]||fiets)||[g[0]])[0]}" ${g===grp?'aria-current="page"':''}>${ico(g[0])}<span>${g[1]}</span></a>`).join('');
  const subs=grp?grp[2].filter(s=>!s[2]||fiets):[];const st=$('#subtabs');
  st.hidden=subs.length<2;st.innerHTML=subs.map(([id,l])=>`<a href="#${id}" ${id===view?'aria-current="page"':''}>${l}</a>`).join('');
  $('#kampType').textContent=k.type||'Kampen';
  const ks=[...data.kampen].sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  $('#kampSel').innerHTML=(ks.length?'':'<option value="">Nog geen kamp</option>')+ks.map(x=>`<option value="${esc(x.id)}" ${x.id===curKamp?'selected':''}>${esc(x.naam)}${x.start?' · '+esc(pd(x.start).getFullYear()):''}</option>`).join('')+`<option value="__new">+ Nieuw kamp…</option>`;
  $('#tripSub').textContent=[k.bestemming,k.start?fd(k.start)+(k.eind?' – '+fd(k.eind):''):''].filter(Boolean).join(' · ');
  const curA=$('#tabs a[aria-current]');if(curA&&curA.scrollIntoView)curA.scrollIntoView({block:'nearest',inline:'nearest'});
  let h='';
  if(mode==='laden') h=`<div class="empty"><b>Gegevens laden…</b>Even geduld, de gedeelde kampgegevens worden opgehaald.</div>`;
  else {
    if(mode==='lokaal'&&!STANDALONE) h+=`<div class="banner"><p>Deze app bewaart nu alleen op dit toestel. Open hem via je claude.ai-link (aangemeld) om alles te delen met de andere monitoren.</p></div>`;
    if(mode==='lokaal'&&STANDALONE&&(!lastBackup||Date.now()-lastBackup>7*864e5)&&COLS.some(c=>data[c].length)) h+=`<div class="banner"><p>Je gegevens staan alleen op dit toestel. ${lastBackup?'Je laatste back-up is meer dan een week oud.':'Je hebt nog geen back-up gemaakt.'}</p><button class="btn small" data-backup="1">Maak back-up</button></div>`;
    const nVb=COLS.reduce((s,c)=>s+data[c].filter(r=>r.voorbeeld).length,0);
    if(nVb) h+=`<div class="banner"><p><b>${nVb} voorbeeldregels</b> tonen hoe alles werkt. Wis ze zodra je je eigen kamp invult.</p><button class="btn small danger" id="wipeVb">Wis voorbeelden</button></div>`;
    if(!k.id&&!['kalender','overzicht','leden','algvergaderingen'].includes(view)) h+=empty('Nog geen kamp gekozen','Maak eerst een kamp aan; alles wat je daarna invult hoort bij dat kamp.',`<button class="btn primary" data-new="kampen">+ Nieuw kamp</button>`);
    else h+=(VIEWS[view]||VIEWS.overzicht)(tripDays());
  }
  const ae=document.activeElement,fid=ae&&ae.id&&ae.classList&&ae.classList.contains('keep')?ae.id:null,pos=fid?ae.selectionStart:0;
  const box=$('#msgs'),atBottom=!box||box.scrollHeight-box.scrollTop-box.clientHeight<80;
  $('#main').innerHTML=h;
  if(fid){const n=document.getElementById(fid);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
  const nb=$('#msgs');if(nb&&atBottom)nb.scrollTop=nb.scrollHeight;
}

const normN=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim();
const LID_KEYS=['naam','gsm','email','geboortedatum','noodcontact','dieet','notities'];
const lidIn=(l,kid)=>data.deelnemers.find(r=>r.kamp===kid&&(r.lid===l.id||normN(r.naam)===normN(l.naam)));
async function lidNaarKamp(lid,kid){
  const l=get('leden',lid),k=get('kampen',kid);if(!l||!k)return;if(lidIn(l,kid)){toast(l.naam+' zit al in '+k.naam);return}
  const dl=data.deelnemers.filter(r=>r.kamp===kid&&actief(r));const max=num(k.maxDeelnemers),maxT=num(k.maxTandems);
  const vol=!!max&&dl.length>=max;const v={kamp:kid,lid,status:vol?'Wachtlijst':'Ingeschreven'};LID_KEYS.forEach(x=>{if(l[x])v[x]=l[x]});
  let noTandem=false;if(l.fietstype){if(l.fietstype==='Tandem'&&!vol&&maxT&&dl.filter(r=>r.fietstype==='Tandem').length>=maxT)noTandem=true;else v.fietstype=l.fietstype}
  const did=await saveRec('deelnemers',null,v);
  for(const m of (Array.isArray(l.medicatie)?l.medicatie:[]))if(m.middel){const mv={deelnemer:did,kamp:kid};MED_F.forEach(([x])=>mv[x]=m[x]||'');await saveRec('medicatie',null,mv)}
  toast(l.naam+(vol?' staat op de wachtlijst van ':' zit nu in ')+k.naam+(noTandem?' (geen tandem meer vrij: kies een fiets)':''));
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function maakZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const [naam,inh] of files){
    const nb=enc.encode(naam),d=typeof inh==='string'?enc.encode(inh):inh,crc=crc32(d);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(8,0,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    parts.push(new Uint8Array(h.buffer),nb,d);cen.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+d.length}
  const cl=cen.reduce((s,x)=>s+x.length,0);const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

async function upload(file){
  const isVid=(file.type||'').startsWith('video/');

  const blob=await shrink(file);
  if(blob.size>20*1024*1024)throw {message:(isVid?'Video':'Bestand')+' is groter dan 20 MB'+(isVid?': kort hem in of film een kortere clip':'')};
  if(mode==='db'){if(!assets)throw {message:'Geen bewerkrechten voor foto\'s'};const r=await assets.upload(blob);return {ph:{id:r.id,url:r.url,type:r.contentType},blob}}
  const key='m'+uid();
  try{await idbDo('media','readwrite',st=>st.put(blob,key))}catch(e){throw {message:'Bewaren op dit toestel lukte niet (opslag vol?)'}}
  MEDIA[key]=URL.createObjectURL(blob);
  return {ph:{idb:key,type:blob.type||'application/octet-stream'},blob};
}
async function shrink(file){
  if(!file.type.startsWith('image/')||file.type==='image/svg+xml')return file;
  try{const bmp=await createImageBitmap(file);const s=Math.min(1,1800/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',mode==='lokaal'?.6:.82));}catch(e){return file}
}

  if(ds.copytxt){const r=get('blog',ds.copytxt);if(!r)return;const txt=[r.titel,r.datum?fdl(r.datum):'',r.tekst].filter(Boolean).join('\n\n');navigator.clipboard.writeText(txt).then(()=>toast('Tekst gekopieerd'),()=>toast('Kopiëren lukt hier niet; selecteer de tekst zelf'));return}
  if(ds.copycol){const from=$('#copyFrom')?.value;if(!from)return;t.disabled=true;const col=ds.copycol;const have=new Set(cur(col).map(r=>r.naam));let n=0;
    for(const r of data[col].filter(x=>x.kamp===from&&!have.has(x.naam))){const {id,kamp,kamer,ploeg,betaald,aangemaakt,gewijzigd,voorbeeld,...rest}=r;await saveRec(col,null,rest);n++}
    toast(n+' overgenomen');return}
  if(ds.bon){const r=get('boekhouding',ds.bon);if(!r)return;
    $('#layer').innerHTML=`<div class="veil" id="veil"><div class="sheet lightbox" role="dialog" aria-modal="true" aria-label="Rekening"><div class="bar2"><h3>${esc(eur(r.bedrag))}</h3><button class="btn small" id="shX">Sluit</button></div><div class="hint">${esc([r.omschrijving,r.datum?fdl(r.datum):'',r.categorie,r.betaaldDoor,r.betaalwijze].filter(Boolean).join(' · '))}</div>${isPdf(r.bon)?`<a class="btn" href="${esc(phSrc(r.bon))}" target="_blank" rel="noopener">Open PDF ↗</a>`:`<img src="${esc(phSrc(r.bon))}" alt="Rekening">`}<div class="actions"><span></span><button class="btn primary" data-edit="boekhouding" data-id="${esc(r.id)}">Wijzig boeking</button></div></div></div>`;return}
  if(t.id==='shX'||t.id==='shC')return closeForm();
  if(t.id==='shDel'){
    const {col,id}=form;
    if(!await armed(t,col==='kampen'?'Wist ook alle gegevens van dit kamp. Zeker?':null))return;
    form.saved=true;closeForm();
    try{
      if(col==='kamers')for(const p of [...data.deelnemers,...data.monitoren].filter(p=>p.kamer===id))await patchRec(data.deelnemers.includes(p)?'deelnemers':'monitoren',p.id,{kamer:''});
      if(col==='ploegen')for(const p of data.deelnemers.filter(p=>p.ploeg===id))await patchRec('deelnemers',p.id,{ploeg:''});
      if(col==='deelnemers')for(const r of data.medicatie.filter(x=>x.deelnemer===id))await delRec('medicatie',r.id);
      if(col==='blog')for(const r of data.reacties.filter(x=>x.post===id))await delRec('reacties',r.id);
      if(col==='groepen')for(const r of data.berichten.filter(x=>x.groep===id))await delRec('berichten',r.id);
      if(col==='kampen'){for(const r of data.contacten.filter(x=>x.kamp===id))await delRec('contacten',r.id);for(const c of SCOPED)for(const r of data[c].filter(x=>x.kamp===id))await delRec(c,r.id);for(const r of data.kalender.filter(x=>x.kamp===id))await patchRec('kalender',r.id,{kamp:''});if(curKamp===id)setKamp('')}
      await delRec(col,id);toast('Verwijderd')}catch(err){toast('Verwijderen lukte niet')}return}
  if(t.id==='phDel'){if(form.ph)form.removed.push(form.ph);form.ph=null;form.blob=null;photoBox();return}
  if(t.id==='bonRead'){let blob=form.blob;if(!blob){try{blob=await (await fetch(phSrc(form.ph))).blob()}catch(err){}}readBon(blob);return}
});
async function sendChat(media){
  const inp=$('#chatInput');const tekst=(inp?inp.value:'').trim();if((!tekst&&!media)||!chatGroup)return;
  drafts.chatInput='';if(inp)inp.value='';
  try{await saveRec('berichten',null,{groep:chatGroup,tekst,van:myId,tijd:Date.now(),...(media?{media:[media]}:{})})}
  catch(err){drafts.chatInput=tekst;render();toast(err&&err.code==='not_granted'?'Je hebt geen schrijfrechten op deze app':'Versturen lukte niet')}
}
document.addEventListener('submit',async e=>{
  if(e.target.id==='chatForm'){e.preventDefault();sendChat();return}
  if(e.target.classList.contains('reactForm')){e.preventDefault();const pid=e.target.dataset.post;const inp=document.getElementById('ri-'+pid);const tekst=inp?inp.value.trim():'';if(!tekst)return;
    drafts['ri-'+pid]='';inp.value='';try{await saveRec('reacties',null,{post:pid,tekst,van:myId,tijd:Date.now()})}catch(err){drafts['ri-'+pid]=tekst;toast('Reactie plaatsen lukte niet')}return}
  e.preventDefault();if(!form)return;const vals=readForm();if(!vals)return;
  const btn=$('#shS');btn.disabled=true;btn.textContent='Bewaren…';
  try{
    const isNewKamp=form.col==='kampen'&&!form.id;
    const nid=await saveRec(form.col,form.id,vals);
    if(form.col==='deelnemers')await saveMeds(nid);
    if(isNewKamp){pendingKamp=nid;setKamp(nid);if(vals.start)calM=vals.start.slice(0,7)}
    form.saved=true;
    form.removed.forEach(delMedia);
    closeForm();render();toast(isNewKamp?'Kamp aangemaakt en gekozen':'Bewaard');
  }catch(err){btn.disabled=false;btn.textContent='Bewaar';toast(err&&err.code==='not_granted'?'Je hebt geen schrijfrechten op deze app':'Bewaren lukte niet, probeer opnieuw')}
});
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-phins]'))e.preventDefault()});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.briefdet)briefOpen[d.dataset.briefdet]=d.open},true);
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='f_aanwezig'){syncDagen();return}
  if(t.dataset.brief!==undefined){const k=K();if(!k.id)return;try{await patchRec('kampen',k.id,{brief:{...(k.brief||{}),[t.dataset.brief]:t.value}});if(t.dataset.brief==='tekst'||t.dataset.brief==='paklijst')toast('Tekst bewaard')}catch(err){toast('Bewaren lukte niet')}return}
  if(t.dataset.briefsel){if(!briefSel)briefSel=new Set(briefGekozen().filter(Boolean).map(p=>p.id));if(t.checked)briefSel.add(t.dataset.briefsel);else briefSel.delete(t.dataset.briefsel);render();return}
  if(t.dataset.brieffiche){const k=K();if(!k.id)return;try{await patchRec('kampen',k.id,{brief:{...(k.brief||{}),fiche:t.checked?'':'nee'}})}catch(err){toast('Bewaren lukte niet')}return}
  if(t.dataset.briefalg){briefAlg=t.checked;render();return}
  if(t.dataset.ploegset){try{await patchRec('deelnemers',t.dataset.ploegset,{ploeg:t.value})}catch(err){toast('Groep wijzigen lukte niet')}return}
  if(t.id==='kampSel'){if(t.value==='__new'){t.value=curKamp;openForm('kampen');return}setKamp(t.value);render();return}
  if(t.dataset.assign){try{await patchRec(t.dataset.pcol||'deelnemers',t.dataset.assign,{kamer:t.value})}catch(err){toast('Kamer wijzigen lukte niet')}return}
  if((t.id==='scanIn'||t.id==='scanPick')&&t.files[0]){
    if(!K().id){toast('Kies eerst een kamp');return}
    const f=t.files[0];t.value='';toast('Rekening wordt opgeladen…');
    try{const {ph,blob}=await upload(f);openForm('boekhouding',null,{soort:'Uitgave',datum:sampleFn?'':iso(new Date()),bon:ph,_blob:blob})}catch(err){toast(err&&err.message?err.message:'Opladen lukte niet')}return}
  if(t.id==='restoreIn'&&t.files[0]){const f=t.files[0];t.value='';readBackup(f);return}
  if(t.id==='prijsKamp'){const k=K();if(!k.id)return;try{await patchRec('kampen',k.id,{bijdrage:t.value.trim()===''?'':num(t.value)});toast('Prijs kamp bewaard')}catch(err){toast('Prijs bewaren lukte niet')}return}
  if(t.classList.contains('bud')){const k=K();if(!k.id)return;const b={...(k.begroting||{})};const v=num(t.value);if(v)b[t.dataset.cat]=v;else delete b[t.dataset.cat];
    try{await patchRec('kampen',k.id,{begroting:b})}catch(err){toast('Begroting bewaren lukte niet')}return}
  if(t.id==='f_categorie'&&form)form.catAuto=false;
  if(t.id==='f_categorie'&&t.value){const s=$('#f_soort');if(s)s.value=catGroup(t.value)==='Opbrengsten'?'Inkomst':'Uitgave';return}
  if(t.id==='mediaIn'&&t.files.length){
    const files=[...t.files];t.value='';const say=s=>{const m=$('#mediaMsg');if(m)m.textContent=s};
    for(let i=0;i<files.length;i++){say(`Opladen ${i+1} van ${files.length}…`);try{const {ph}=await upload(files[i]);if(!form)return;form.media.push(ph);form.newMedia.push(ph);mediaBox()}catch(err){say(err&&err.message?err.message:'Opladen lukte niet');return}}
    say('');return}
  if(t.id==='chatMedia'&&t.files[0]){const f=t.files[0];t.value='';toast('Opladen…');try{const {ph}=await upload(f);await sendChat(ph)}catch(err){toast(err&&err.message?err.message:'Opladen lukte niet')}return}
  if(t.id==='phIn'&&t.files[0]){
    const f=t.files[0];t.value='';const m=$('#aiMsg');if(m)m.textContent='Opladen…';
    try{const {ph,blob}=await upload(f);if(form.ph)form.removed.push(form.ph);form.ph=ph;form.blob=blob;form.uploadedNew=true;photoBox();if(form.col==='boekhouding')readBon(blob)}catch(err){const m2=$('#aiMsg');if(m2)m2.textContent=err&&err.message?err.message:'Opladen lukte niet'}}
});
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('.sheet.groot textarea'))groei(e.target);
  if(e.target.id==='f_omschrijving'&&form&&form.col==='boekhouding'){const c=$('#f_categorie'),s=$('#f_soort');if(c&&(!c.value||form.catAuto)&&(!s||s.value!=='Inkomst')){const g=guessCat(e.target.value);if(g){c.value=g;form.catAuto=true}else if(form.catAuto){c.value='';}}}if(e.target.classList.contains('keep'))drafts[e.target.id]=e.target.value;
  if(e.target.id==='chatInput')document.querySelectorAll('[data-wabase]').forEach(a=>a.href=a.dataset.wabase+encodeURIComponent(e.target.value));if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#veil'))closeForm()});
document.addEventListener('mousedown',e=>{if(e.target.id==='veil')closeForm()});

async function exportCsv(){
  const rows=[['Kamp','Datum','Soort','Omschrijving','Categorie','Bedrag','Betaald door','Betaalwijze','Rekening','Notities']];const kn=K().naam||'';
  cur('boekhouding').sort((a,b)=>(a.datum||'').localeCompare(b.datum||'')).forEach(r=>rows.push([kn,r.datum||'',r.soort||'',r.omschrijving||'',r.categorie||'',(r.soort==='Inkomst'?1:-1)*num(r.bedrag),r.betaaldDoor||'',r.betaalwijze||'',r.bon?'ja':'nee',r.notities||'']));
  cur('deelnemers').filter(r=>num(r.betaald)).forEach(r=>rows.push([kn,'','Inkomst','Prijs kamp '+r.naam,'Prijs kamp',num(r.betaald),r.naam,'','','']));
  const csv='﻿'+rows.map(r=>r.map(v=>{const s=typeof v==='number'?v.toFixed(2).replace('.',','):String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\n');
  const fn='boekhouding-'+(kn||'kamp').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv';
  if(downloads){try{await downloads.save({filename:fn,data:new Blob([csv],{type:'text/csv'})});return}catch(err){if(err&&err.code==='declined')return}}
  if(STANDALONE){saveFile(fn,new Blob([csv],{type:'text/csv'}));return}
  try{await navigator.clipboard.writeText(csv);toast('CSV gekopieerd: plak in Excel')}catch(err){toast('Exporteren lukt hier niet')}
}

route();boot();
