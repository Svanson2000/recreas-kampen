<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recreas Kampen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>S-Sport Recreas Kampen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: witte kop met woordmerk en kampkeuze, hoofdmenu met iconen (onderbalk op gsm), één werkkolom; formulieren in een schuifblad. Kleuren uit het S-Sport//Recreas-logo: rood, koraal, petrol. */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --surface2:#eef1f2; --line:#e2e6e8;
  --fg:#1c2226; --muted:#69737a;
  --orange:#da002f; /* merkrood S-Sport = accent */
  --coral:#f0859c; --teal:#078ea4; --purple:#8a6391; --red:#a8002a; --gold:#d98300; --ok:#078ea4;
  --glow:rgba(218,0,47,.08); --tealglow:rgba(8,166,189,.10); --purpleglow:rgba(138,99,145,.10);
  --onaccent:#ffffff;
  --display:"Montserrat","Avenir Next",system-ui,sans-serif;
  --body:"Nunito Sans","Avenir Next",system-ui,sans-serif;
  --mono:"Montserrat","Avenir Next",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(28,34,38,.05),0 4px 14px rgba(28,34,38,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1b1f23; --surface2:#242a2f; --line:#2f363c;
  --fg:#f1f4f5; --muted:#9aa4ab;
  --orange:#ff3b62; --coral:#f7a1b4; --teal:#2fc3d8; --purple:#b892bf; --red:#ff6f82; --gold:#f2aa45; --ok:#2fc3d8;
  --glow:rgba(255,59,98,.14); --tealglow:rgba(47,195,216,.12); --purpleglow:rgba(184,146,191,.14); --onaccent:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1b1f23; --surface2:#242a2f; --line:#2f363c;
  --fg:#f1f4f5; --muted:#9aa4ab;
  --orange:#ff3b62; --coral:#f7a1b4; --teal:#2fc3d8; --purple:#b892bf; --red:#ff6f82; --gold:#f2aa45; --ok:#2fc3d8;
  --glow:rgba(255,59,98,.14); --tealglow:rgba(47,195,216,.12); --purpleglow:rgba(184,146,191,.14); --onaccent:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* kop */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 8px}
.mark{width:38px;height:38px;flex:none}
.brand h1{font-size:clamp(20px,4.6vw,28px)}
.brand h1 span{color:var(--orange)}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.brand .grow{flex:1;min-width:0}
.sync{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.savebtn{display:inline-flex;align-items:center;gap:6px;margin-left:auto;flex:none}.savebtn .ico{width:16px;height:16px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--red)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px;padding:7px 12px;border-radius:999px;border:1px solid transparent}
nav.tabs a:hover{color:var(--fg);border-color:var(--line)}
nav.tabs a[aria-current="page"]{background:var(--fg);color:var(--bg)}

main{padding-block:20px 80px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:clamp(30px,7vw,46px);flex:1;min-width:0}
.head h2 em{font-style:normal;color:var(--orange)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--onaccent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.banner{border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:14px}
.banner p{margin:0;flex:1;min-width:200px}

.search{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}

/* kaarten */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;width:100%}
button.card:hover{border-color:var(--muted)}
.card .t{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;overflow-wrap:anywhere}
.card .m{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.card .row{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--fg);white-space:nowrap}
.chip.o{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.chip.r{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.chip.g{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.chip.k{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);text-transform:uppercase;font-size:22px;margin-bottom:4px}
.group{margin-top:22px}
.group>.lbl{display:block;margin-bottom:8px}

/* overzicht */
.hero{border:1px solid var(--line);border-radius:18px;padding:22px;background:radial-gradient(120% 140% at 100% 0%,var(--glow),transparent 60%),var(--surface);display:grid;gap:14px}
.hero h2{font-size:clamp(34px,8vw,60px)}
.hero .when{font-family:var(--mono);font-size:13px;color:var(--muted)}
.count{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;color:var(--orange)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin-top:4px}
.stat .v small{font-size:16px;color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.panel h3{font-size:20px;margin-bottom:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline;min-width:0}
.li:first-child{border-top:0}
.li .tm{font-family:var(--mono);font-size:12px;color:var(--muted);width:46px;flex:none}
.li .x{flex:1;min-width:0;overflow-wrap:anywhere}
.li .x small{display:block;color:var(--muted);font-size:13px}

/* dagplanning */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:center;min-width:64px}
.day .d{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.day .w{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day[aria-pressed="true"] .w{color:var(--bg)}
.tl{display:flex;flex-direction:column;gap:8px}
.mdays{display:flex;flex-direction:column;gap:12px}
.mday{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px}
.mdh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mslots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:720px){.mslots{grid-template-columns:1fr 1fr}}
.mcel{border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcel.vol{border-style:solid;border-left:4px solid var(--ok)}
.mitem{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}.mitem b{overflow-wrap:anywhere}.mitem small{color:var(--muted);font-size:12px}
.mitem:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
.mcel.td{background:color-mix(in srgb,var(--gold) 7%,transparent)}
.tdmove{display:flex;gap:4px;flex-wrap:wrap}.tdmove .btn{padding:2px 8px;font-size:12px}
.madd{font-size:13px;color:var(--muted)}
.dagschema{display:flex;flex-direction:column;gap:10px}
.blok{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.blokh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.blokh h4{margin:0;font-size:16px;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.blokh h4 .lbl{font-weight:600;margin-left:6px}
.blok.douche{border:2px dashed var(--teal);background:color-mix(in srgb,var(--teal) 8%,var(--surface))}.blok.douche h4{color:var(--teal)}
.tli{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:stretch;text-align:left;background:none;border:0;padding:0;width:100%}
.tli .tm{font-family:var(--mono);font-size:13px;padding-top:12px;color:var(--muted)}
.tli .bx{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:12px;padding:10px 12px;min-width:0}
.tli:hover .bx{border-color:var(--muted)}
.tli .bx .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tli .bx .n{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.tli .bx .s{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.tli.rit .bx{border-left-color:var(--orange)}
.tli.act .bx{border-left-color:var(--gold)}
.tli.eet .bx{border-left-color:var(--ok)}
.tli.pln .bx{border-left-color:var(--fg)}

/* kamers */
.room .beds{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.bed{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:8px;padding:6px 8px;min-width:0}
.bed span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed.free{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.bed select{max-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:13px}
.full{color:var(--ok)} .over{color:var(--red)}

/* boekhouding */
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:6px 0}
.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.tx:hover .amt{color:var(--orange)}
.tx .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
.amt{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--ok)}
.pos{color:var(--ok)} .neg{color:var(--red)}

/* rekeningen */
.scan{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px dashed color-mix(in srgb,var(--orange) 60%,transparent);border-radius:16px;padding:18px;margin-bottom:16px;background:color-mix(in srgb,var(--orange) 6%,var(--surface))}
.scan p{margin:0;flex:1;min-width:220px;color:var(--muted)}
.bons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bon{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.bon .img{aspect-ratio:3/4;max-width:100%;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.bon .img img{width:100%;height:100%;object-fit:cover}
.bon .c{padding:8px 10px}
.bon .c div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--muted)}

/* schuifblad */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:30px}
.sheet .bar2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card.lid{display:flex;flex-direction:column;gap:8px;cursor:default}
.lidnaam{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px}.lidnaam:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:6px}
.lidnaam .m{color:var(--muted);font-size:13px}
.ledtools{margin-bottom:14px}.ledtools summary{cursor:pointer;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.ledtools textarea{width:100%;min-height:120px;margin:8px 0}
.medsec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.medhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.medhead h4{margin:0;font-size:16px}
#medsBox{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.medrow{width:100%;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:12px;padding:10px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}
.medrowh{display:flex;justify-content:space-between;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--orange);outline:none}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo img{width:96px;height:128px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.photo .pdf{width:96px;height:128px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted)}
.ai{font-size:13px;color:var(--gold)}
.lightbox img{max-width:100%;border-radius:12px;border:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
/* kampkeuze */
.kamprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:8px}
.kampsel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:15px;max-width:100%;min-width:0}
/* kalender */
.calnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.calnav h3{font-size:26px;flex:1;min-width:160px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cd{min-height:92px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0}
.cd:hover{border-color:var(--muted)}
.cd.out{opacity:.38}
.cd.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.cd .dn{font-family:var(--display);font-weight:800;font-size:18px;line-height:1;display:flex;justify-content:space-between;align-items:center}
.cd .dot{width:7px;height:7px;border-radius:50%;background:var(--fg)}
.kb{height:6px;border-radius:3px;flex:none}
.ev{font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface2);border-radius:4px;padding:1px 4px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
@media (max-width:560px){.cd{min-height:58px;padding:4px}.cd .dn{font-size:15px}.ev{font-size:0;height:4px;padding:0;background:var(--muted)}}
.tli.cal .bx{border-left-color:var(--red)}
/* welkom */
.welcome{padding-block:6px 14px;display:grid;gap:8px}
.welcome h2{font-size:clamp(40px,10vw,72px)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}

body::before{background:var(--surface)}
.brand{padding-block:12px 6px}
.wm{font-family:var(--display);font-weight:600;font-size:clamp(19px,4.4vw,25px);letter-spacing:.01em;text-transform:uppercase;color:var(--orange);line-height:1;white-space:nowrap}
.wm span{color:var(--orange)}
.dots{display:grid;grid-template-columns:repeat(2,13px);gap:3px 4px;transform:skewX(-12deg);flex:none}
.dots i{width:13px;height:11px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--orange);transform:translateY(3px)}.dots i:nth-child(2){background:var(--coral)}.dots i:nth-child(3){background:var(--teal);transform:translateY(3px)}.dots i:nth-child(4){background:var(--purple)}
.wm i{font-style:normal;color:var(--coral);font-weight:500;letter-spacing:-.12em;margin:0 .14em 0 .02em}
.tag{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-top:4px}
.sync{font-family:var(--display);font-weight:600;font-size:10px}
.kamprow{padding-bottom:10px}
.kampsel{font-family:var(--display);font-weight:700;text-transform:none;font-size:14px;border-radius:999px;padding:7px 14px;background:var(--surface2);border-color:transparent}
#tripSub{font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.02em;text-transform:none;color:var(--muted)}

/* hoofdmenu */
nav.tabs{gap:6px;padding-bottom:10px}
nav.tabs a{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:13.5px;letter-spacing:.01em;text-transform:none;padding:8px 14px;border-radius:12px;color:var(--muted);border:1px solid transparent}
nav.tabs a .ico{width:19px;height:19px}
nav.tabs a:hover{color:var(--fg);background:var(--surface2);border-color:transparent}
nav.tabs a[aria-current="page"]{background:var(--orange);color:var(--onaccent)}
nav.tabs a.hometab{font-size:13.5px;padding:8px 14px}
.subtabs{gap:6px;padding-bottom:12px}
.subtabs a{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:0;text-transform:none;padding:6px 13px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid transparent}
.subtabs a:hover{color:var(--fg)}
.subtabs a[aria-current="page"]{background:var(--tealglow);color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,transparent)}

/* onderbalk op gsm */
@media (max-width:720px){
  header.top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface)}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;gap:0;justify-content:space-around;overflow:visible;
    background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  nav.tabs a,nav.tabs a.hometab{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;border-radius:12px;text-align:center}
  nav.tabs a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav.tabs a .ico{width:23px;height:23px}
  nav.tabs a[aria-current="page"]{background:var(--glow);color:var(--orange)}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .brand .sync span{display:none}
}

/* knoppen en kaarten */
.btn{border-radius:12px;font-family:var(--display);font-weight:700;font-size:13.5px;background:var(--surface);box-shadow:var(--shadow)}
.btn.small{font-size:12.5px;border-radius:10px;box-shadow:none}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--onaccent)}
.card,.panel,.stat,.kcard,.main,.post,.chat,.empty{box-shadow:var(--shadow)}
.card,.panel,.stat,.kcard,.post{border-radius:16px}
.empty{background:var(--surface);border-style:solid}
.empty b{font-family:var(--display);text-transform:none;font-size:18px}
.card .t,.kcard .t{font-family:var(--display);font-weight:700;font-size:17px;text-transform:none;letter-spacing:0;line-height:1.25}
.chip{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.01em;border-radius:999px;padding:3px 9px}
.panel h3{font-size:16px;text-transform:none;margin-bottom:12px}
.head{margin-bottom:18px}
.head h2{font-size:clamp(24px,5.4vw,34px);text-transform:none}
.head h2 em{color:var(--teal)}
.search{border-radius:12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.01em}
.stat .v small{font-size:13px}
.amt{font-family:var(--display);font-weight:700;font-size:16px}
.amt.in,.pos{color:var(--ok)}

/* startpagina */
.welcome h2{font-size:clamp(28px,7vw,44px);text-transform:none}
.welcome .lbl{color:var(--teal)}
.kgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.kcard{border-width:1.5px}
.kcard.sel{border-color:var(--orange);box-shadow:0 0 0 3px var(--glow),var(--shadow)}
.kcard.new{box-shadow:none;background:transparent;border:1.5px dashed var(--line)}
.kcard.new .t{color:var(--orange)}
.mains{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.main{border-radius:20px;border:1px solid var(--line)}
.mainhead{grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:2px 14px;align-items:center;padding:18px;background:none}
.micon{grid-row:1/3;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--glow);color:var(--orange)}
.micon .ico{width:26px;height:26px}
.m-monitoren .micon,.m-boekhouding .micon{background:var(--tealglow);color:var(--teal)}
.m-zorg .micon{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.m-kalender .micon,.m-socials .micon,.m-algvergaderingen .micon{background:var(--purpleglow);color:var(--purple)}
.mainhead .n{font-size:20px;text-transform:none;letter-spacing:-.005em;line-height:1.1;grid-column:2}
.mainhead .c{font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0;grid-column:2}
.mainhead .arrow{grid-column:3;grid-row:1/3;font-family:var(--display);font-size:28px;font-weight:500;color:var(--line)}
.mainhead:hover .arrow{color:var(--orange)}
.mainhead:hover .n{color:var(--fg)}
.mainsubs a{padding:11px 18px;font-weight:600}
.mainsubs a:hover{color:var(--orange);background:var(--surface2)}
.mainsubs b{font-family:var(--display);font-size:11px;min-width:24px;text-align:center;background:var(--surface2);border-radius:999px;padding:2px 8px;color:var(--muted)}
.hero{border-radius:20px;background:radial-gradient(120% 140% at 100% 0%,var(--tealglow),transparent 60%),var(--surface);box-shadow:var(--shadow)}
.hero h2{font-size:clamp(24px,6vw,38px);text-transform:none}
.hero .when{font-family:var(--body);font-size:14px}
.count{font-family:var(--display);font-size:18px;text-transform:none;color:var(--teal)}

/* dagplanning en kalender */
.day{border-radius:14px}
.day .d{font-family:var(--display);font-size:20px}
.day[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--onaccent)}
.day[aria-pressed="true"] .w{color:var(--onaccent)}
.tli .bx{border-radius:14px;box-shadow:var(--shadow)}
.tli .bx .n{font-family:var(--display);font-weight:700;font-size:16px;text-transform:none}
.tli.act .bx{border-left-color:var(--teal)}
.tli.eet .bx{border-left-color:var(--gold)}
.calnav h3{font-size:20px;text-transform:none}
.cd{border-radius:12px}
.cd .dn{font-family:var(--display);font-size:14px;font-weight:700}
.cd.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.gname{font-family:var(--display);font-weight:700;font-size:15px;text-transform:none}

/* blog, balans */
.post h3{font-size:20px;text-transform:none}
.bal tr.ghead th{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal)}
.bal tr.gtot td{font-size:14px;text-transform:none;border-top:2px solid var(--fg)}
.msg.me{background:var(--glow);border-color:color-mix(in srgb,var(--orange) 30%,var(--line))}
.msg .from{color:var(--teal)}
.sheet h3{font-size:22px;text-transform:none}
.fld input,.fld select,.fld textarea{border-radius:12px;background:var(--surface)}
.sheet{background:var(--bg)}
.toast{border-radius:12px;font-family:var(--display);font-weight:600;font-size:14px}
/* capaciteit */
.capbar{margin-bottom:12px}
.linkchip{border:1px dashed var(--line);background:transparent;cursor:pointer;color:var(--orange)}
.card.inactief{opacity:.7}
/* contacten */
.ccard .telnr{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;user-select:all;color:var(--fg)}
.ccard.vast{border-left:4px solid var(--teal)}
.ccard.nood{border-left-color:var(--orange);background:linear-gradient(90deg,var(--glow),transparent 60%),var(--surface)}
.ccard.leeg{border:1.5px dashed var(--line);box-shadow:none;background:transparent;align-items:flex-start}
.ccard.leeg .t{color:var(--orange)}
.ccard .btn.primary{color:var(--onaccent)}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <a class="home" href="#overzicht" aria-label="Naar de startpagina"><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div class="grow"><h1 class="wm" aria-label="S-Sport Recreas"><span>S·SPORT</span><i>//</i><span>RECREAS</span></h1><div class="tag" id="kampType">Kampen</div></div></a>
      <div class="sync" id="sync"><i></i><span>Laden</span></div>
      <button type="button" class="btn small primary savebtn" data-backup="1" title="Bewaar alle gegevens en foto's als bestand op deze computer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4"/><path d="M8 20v-6h8v6"/></svg><span>Opslaan</span></button>
    </div>
    <div class="kamprow"><select class="kampsel" id="kampSel" aria-label="Kies een kamp"></select><span class="sub" id="tripSub"></span></div>
    <nav class="tabs" id="tabs" aria-label="Menu"></nav>
    <nav class="subtabs" id="subtabs" aria-label="Onderdelen" hidden></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="layer"></div>

<script>
"use strict";
/* ---------- schema ---------- */
const FIETSTYPES=['Gewone fiets','Driewieler','Duofiets','Tandem'];
const actief=r=>!r.status||r.status==='Ingeschreven';
function capInfo(){const k=K();const dl=cur('deelnemers').filter(actief);const max=num(k.maxDeelnemers),maxT=num(k.maxTandems);const tnd=dl.filter(r=>r.fietstype==='Tandem').length;
  return {n:dl.length,max,vol:!!max&&dl.length>=max,vrij:max?Math.max(0,max-dl.length):null,t:tnd,maxT,tVol:!!maxT&&tnd>=maxT,wacht:cur('deelnemers').filter(r=>r.status==='Wachtlijst').length}}
const PLOEG_KLEUREN=[['Rood','#e5484d'],['Oranje','#f76b15'],['Geel','#f5b400'],['Groen','#30a46c'],['Turquoise','#12a594'],['Blauw','#0090ff'],['Paars','#8e4ec6'],['Roze','#e93d82'],['Bruin','#a0703c'],['Grijs','#80838d'],['Zwart','#202124'],['Lichtblauw','#5fb7e8']];
const KAMP_TYPES=['Fietsvakantie','Sportkamp','Zeekamp','Skikamp','Wandelkamp','Avonturenkamp','Dagkamp','Andere'];
const CAT_GROUPS=['Vaste kosten','Variabele kosten','Opbrengsten'];
const DEF_CATS=[['Huur kampplaats','Vaste kosten'],['Eten','Vaste kosten'],['Vervoer','Vaste kosten'],['Vergoeding monitoren','Vaste kosten'],
  ['Terrasjes','Variabele kosten'],['Activiteiten','Variabele kosten'],['Onvoorziene kosten','Variabele kosten'],['Materiaal','Variabele kosten'],
  ['Sponsoring','Opbrengsten']];
const LEGACY_CAT={'Subsidie':'Opbrengsten','Terugbetaling':'Opbrengsten','Andere inkomst':'Opbrengsten','Andere opbrengst':'Opbrengsten','Verblijf':'Vaste kosten','Eten & drinken':'Vaste kosten','Fietsen & herstel':'Variabele kosten','Medisch':'Variabele kosten','Andere':'Variabele kosten'};
function cats(){const c=DEF_CATS.map(([naam,soort])=>({naam,soort,std:1}));(data.categorieen||[]).forEach(r=>{if(r.naam&&!c.some(x=>x.naam.toLowerCase()===String(r.naam).toLowerCase()))c.push({naam:r.naam,soort:CAT_GROUPS.includes(r.soort)?r.soort:'Variabele kosten',id:r.id})});return c}
const catGroup=n=>{const c=cats().find(x=>x.naam===n);return c?c.soort:(LEGACY_CAT[n]||'Variabele kosten')};
const CAT_WOORDEN={'Terrasjes':['terras','café','cafe','bar ','drank','koffie','pint','bier','frisdrank','ijsje','taverne','brasserie','consumptie','aperitief','tearoom'],
  'Eten':['supermarkt','colruyt','delhaize','aldi','lidl','carrefour','spar','okay','albert heijn','jumbo','bakker','brood','slager','boodschappen','eten','maaltijd','frituur','pizza','traiteur','restaurant','picknick','ontbijt','lunch'],
  'Vervoer':['benzine','diesel','tanken','brandstof','trein','nmbs','bus ','parking','tol ','taxi','shell','q8','esso','total','dats','lukoil','huurwagen','busvervoer'],
  'Huur kampplaats':['huur','verblijf','camping','jeugdherberg','hotel','overnachting','kampplaats'],
  'Activiteiten':['activiteit','toegang','inkom','zwembad','museum','pretpark','kajak','bowling','minigolf','klimmen','escape','rondleiding','excursie'],
  'Materiaal':['materiaal','brico','gamma','hubo','action','decathlon','fietsonderdeel','binnenband','fietsband','batterij'],
  'Vergoeding monitoren':['vergoeding']};
function guessCat(txt){const t=' '+String(txt||'').toLowerCase()+' ';if(!t.trim())return '';const ok=expenseCats();
  for(const c of ok)if(c.length>3&&t.includes(c.toLowerCase()))return c;
  for(const [c,ws] of Object.entries(CAT_WOORDEN))if(ok.includes(c)&&ws.some(w=>t.includes(w)))return c;
  return ''}
const bkCat=r=>{const isIn=r.soort==='Inkomst';const n=r.categorie||(isIn?'Sponsoring':'Onvoorziene kosten');let g=catGroup(n);if(isIn)g='Opbrengsten';else if(g==='Opbrengsten')g='Variabele kosten';return [g,n]};
function showCat(g,n){const rs=cur('boekhouding').filter(r=>{const [gg,nn]=bkCat(r);return gg===g&&nn===n}).sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
  const tot=rs.reduce((s,r)=>s+num(r.bedrag),0);const bons=rs.filter(r=>r.bon);
  $('#layer').innerHTML=`<div class="veil" id="veil"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="catT"><div class="bar2"><h3 id="catT">${esc(n)}</h3><button type="button" class="btn small" id="shX">Sluit</button></div>
  <p class="hint" style="margin:0">${esc(g)} · ${rs.length} boeking${rs.length===1?'':'en'} · samen <b class="num">${esc(eur(tot))}</b>${bons.length?' · '+bons.length+' document'+(bons.length===1?'':'en'):''}</p>
  ${bons.length?`<div class="bons catbons">${bons.map(r=>`<button class="bon" data-bon="${esc(r.id)}"><div class="img">${isPdf(r.bon)?'<span class="lbl">PDF</span>':`<img src="${esc(phSrc(r.bon))}" alt="" loading="lazy">`}</div><div class="c"><div class="amt">${esc(eur(r.bedrag))}</div><div>${esc(r.omschrijving||'')}</div><div>${esc(r.datum?fd(r.datum):'')}</div></div></button>`).join('')}</div>`:''}
  ${rs.length?`<div>${rs.map(txRow).join('')}</div>`:'<p class="hint">Nog geen boekingen in deze categorie.</p>'}
  <div class="actions"><span></span><button class="btn primary" data-new="boekhouding" data-cat="${esc(n)}">+ Boeking in ${esc(n)}</button></div></div></div>`}
const expenseCats=()=>cats().filter(c=>c.soort!=='Opbrengsten').map(c=>c.naam);
const SCHEMA={
  kampen:{one:'kamp',global:1,fields:[
    {k:'naam',l:'Naam van het kamp',req:1,w:1},
    {k:'type',l:'Soort kamp',t:'select',o:KAMP_TYPES,req:1},
    {k:'maxDeelnemers',l:'Maximum aantal deelnemers',t:'num'},{k:'maxTandems',l:'Maximum aantal tandems (alleen fietskamp)',t:'num'},
    {k:'fietsonderdelen',l:'Fietsritten en fietsen tonen',t:'select',o:['Automatisch','Ja','Nee']},
    {k:'start',l:'Eerste dag',t:'date'},{k:'eind',l:'Laatste dag',t:'date'},
    {k:'bestemming',l:'Bestemming / regio',w:1},
    {k:'bijdrage',l:'Prijs kamp per deelnemer (€)',t:'num'},{k:'budget',l:'Budget uitgaven (€)',t:'num'},
    {k:'verantwoordelijke',l:'Hoofdverantwoordelijke'},{k:'noodnummer',l:'Noodnummer begeleiding',t:'tel'},
    {k:'notities',l:'Algemene info',t:'area',w:1}]},
  kalender:{one:'datum',global:1,fields:[
    {k:'titel',l:'Wat',req:1,w:1},
    {k:'datum',l:'Datum',t:'date',req:1},{k:'tot',l:'Tot en met (optioneel)',t:'date'},
    {k:'uur',l:'Uur',t:'time'},
    {k:'soort',l:'Soort',t:'select',o:['Vergadering','Deadline','Inschrijving','Vertrek / terugkeer','Kamp-activiteit','Andere']},
    {k:'kamp',l:'Hoort bij kamp',t:'ref',ref:'kampen',w:1},
    {k:'notities',l:'Notities',t:'area',w:1}]},
  leden:{one:'persoon',global:1,fields:[
    {k:'naam',l:'Naam (voornaam en achternaam)',req:1,w:1},
    {k:'gsm',l:'Gsm',t:'tel'},
    {k:'email',l:'E-mail (deelnemer of ouders)',t:'email'},
    {k:'geboortedatum',l:'Geboortedatum',t:'date'},
    {k:'fietstype',l:'Fiets (bij een fietskamp)',t:'select',o:FIETSTYPES},
    {k:'noodcontact',l:'Noodcontact (naam + nummer)',w:1},
    {k:'dieet',l:'Dieet / allergieën',w:1},
    {k:'notities',l:'Notities',t:'area',w:1}]},
  deelnemers:{one:'deelnemer',fields:[
    {k:'naam',l:'Naam',req:1,w:1},
    {k:'gsm',l:'Gsm',t:'tel'},
    {k:'email',l:'E-mail (deelnemer of ouders)',t:'email'},
    {k:'geboortedatum',l:'Geboortedatum',t:'date'},
    {k:'kamer',l:'Kamer',t:'ref',ref:'kamers'},
    {k:'ploeg',l:'Groep',t:'ref',ref:'ploegen'},
    {k:'betaald',l:'Prijs kamp betaald (€)',t:'num'},
    {k:'status',l:'Inschrijving',t:'select',o:['Ingeschreven','Wachtlijst','Geannuleerd']},
    {k:'fietstype',l:'Fiets',t:'select',o:FIETSTYPES,fiets:1},
    {k:'noodcontact',l:'Noodcontact (naam + nummer)',w:1},
    {k:'dieet',l:'Dieet / allergieën',w:1},
    {k:'notities',l:'Notities',t:'area',w:1}]},
  monitoren:{one:'monitor',fields:[
    {k:'naam',l:'Naam',req:1,w:1},
    {k:'functie',l:'Functie',t:'select',o:['Hoofdmonitor','Monitor','Fietsbegeleider','Sportinstructeur','Kok / keuken','EHBO','Chauffeur','Stagiair']},
    {k:'gsm',l:'Gsm',t:'tel'},
    {k:'email',l:'E-mail',t:'email'},
    {k:'brevet',l:'Brevet',t:'select',o:['Geen','Animator','Hoofdanimator','Instructeur / trainer','Andere']},
    {k:'ehbo',l:'EHBO',t:'select',o:['Ja','Nee']},
    {k:'rijbewijs',l:'Rijbewijs',t:'select',o:['Nee','B','B+E','C / D']},
    {k:'kamer',l:'Kamer',t:'ref',ref:'kamers'},
    {k:'aanwezig',l:'Gaat mee',t:'select',o:['Hele kamp','Enkele dagen']},
    {k:'dagen',l:'Welke dagen gaat deze monitor mee?',t:'days',w:1},
    {k:'vergoeding',l:'Vergoeding (€)',t:'num'},
    {k:'taken',l:'Taken en verantwoordelijkheden',t:'area',w:1},
    {k:'noodcontact',l:'Noodcontact (naam + nummer)',w:1},
    {k:'dieet',l:'Dieet / allergieën',w:1},
    {k:'notities',l:'Notities',t:'area',w:1}]},
  ploegen:{one:'groep',fields:[
    {k:'naam',l:'Naam van de groep',req:1},
    {k:'kleur',l:'Kleur',t:'select',o:PLOEG_KLEUREN.map(x=>x[0]),req:1},
    {k:'begeleider',l:'Begeleider',t:'ref',ref:'monitoren'},
    {k:'notities',l:'Notities',t:'area',w:1}]},
  kamers:{one:'kamer',fields:[
    {k:'naam',l:'Kamer (nummer of naam)',req:1},
    {k:'bedden',l:'Aantal bedden',t:'num'},
    {k:'type',l:'Type',t:'select',o:['Eenpersoons','Tweepersoons','Twin','Meerpersoons','Tent / chalet']},
    {k:'locatie',l:'Locatie',t:'ref',ref:'locaties'},
    {k:'notities',l:'Notities',t:'area',w:1}]},
  locaties:{one:'locatie',fields:[

async function makeBackup(){

  // in de gedeelde versie staan foto's online: haal ze op en stop ze mee in het bestand

    if(typeof o.url==='string'&&o.id&&!o.idb){const key='a'+String(o.id).replace(/[^\w-]/g,'');
      try{if(!gezien[key]){const b=await (await fetch(o.url)).blob();media[key]=await blobToDataURL(b);gezien[key]=1}o.idb=key;o.type=o.type||'';delete o.url;delete o.id}catch(e){mis++}return}

  const blob=new Blob([JSON.stringify({app:'recreas-kampen',versie:1,gemaakt:new Date().toISOString(),data:kopie,media})],{type:'application/json'});
  const nu=new Date(),fn='recreas-kampen-'+iso(nu)+'-'+String(nu.getHours()).padStart(2,'0')+'u'+String(nu.getMinutes()).padStart(2,'0')+'.json';

  }

/* groepsverdeling */
const kleurHex=n=>(PLOEG_KLEUREN.find(x=>x[0]===n)||[])[1]||'';
const ploegVan=p=>p&&p.ploeg?get('ploegen',p.ploeg):null;
const pKleur=p=>{const g=ploegVan(p);return g?kleurHex(g.kleur):''};
const pTag=p=>{const g=ploegVan(p);return g?`<span class="pdot" style="--pc:${kleurHex(g.kleur)||'var(--muted)'}" title="Groep ${esc(g.naam)}" aria-label="Groep ${esc(g.naam)}"></span>`:''};
/* algemene deelnemerslijst (los van de kampen) */
const normN=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim();
const LID_KEYS=['naam','gsm','email','geboortedatum','noodcontact','dieet','notities'];
const lidIn=(l,kid)=>data.deelnemers.find(r=>r.kamp===kid&&(r.lid===l.id||normN(r.naam)===normN(l.naam)));
async function lidNaarKamp(lid,kid){
  const l=get('leden',lid),k=get('kampen',kid);if(!l||!k)return;if(lidIn(l,kid)){toast(l.naam+' zit al in '+k.naam);return}
  const dl=data.deelnemers.filter(r=>r.kamp===kid&&actief(r));const max=num(k.maxDeelnemers),maxT=num(k.maxTandems);
  const vol=!!max&&dl.length>=max;const v={kamp:kid,lid,status:vol?'Wachtlijst':'Ingeschreven'};LID_KEYS.forEach(x=>{if(l[x])v[x]=l[x]});
  let noTandem=false;if(l.fietstype){if(l.fietstype==='Tandem'&&!vol&&maxT&&dl.filter(r=>r.fietstype==='Tandem').length>=maxT)noTandem=true;else v.fietstype=l.fietstype}
  const did=await saveRec('deelnemers',null,v);
  for(const m of (Array.isArray(l.medicatie)?l.medicatie:[]))if(m.middel){const mv={deelnemer:did,kamp:kid};MED_F.forEach(([x])=>mv[x]=m[x]||'');await saveRec('medicatie',null,mv)}
  toast(l.naam+(vol?' staat op de wachtlijst van ':' zit nu in ')+k.naam+(noTandem?' (geen tandem meer vrij: kies een fiets)':''));
}

const vulIn=(s,v)=>String(s||'').replace(/\{(\w+)\}/g,(m,n)=>n in v?(v[n]?v[n]:'\u0001…\u0002'):m);
function briefModel(p){

/* gedeelde dagkeuze */
let xDag=null,xKampDag='',xMoment='',attSel=null,xWie='';
function kampDagOf(){
  if(xKampDag!==curKamp){xKampDag=curKamp;xDag=null;xMoment='';attSel=null;xWie=''}
  const ds=kampDagen(),t=iso(new Date());if(!xDag||(ds.length&&!ds.includes(xDag)))xDag=ds.includes(t)?t:(ds[0]||t);return xDag;
}
const dagRij=()=>{const ds=kampDagen(),d=kampDagOf();return ds.length>1?`<div class="row xchips" role="group" aria-label="Dag">${ds.map(x=>`<button class="chip${x===d?' o':''}" data-xdag="${x}" aria-pressed="${x===d}">${esc(fd(x))}</button>`).join('')}</div>`:''};

/* vinkjes: één record per vinkje, zodat meerdere monitoren tegelijk kunnen afvinken */
const vinkMap=(soort,dag)=>{const m=new Map();cur('afvink').forEach(r=>{if(r.soort===soort&&r.dag===dag)m.set(r.sleutel,r)});return m};
const vinkBezig=new Set();
async function zetVink(soort,dag,sleutel,aan){
  const id=soort+'|'+dag+'|'+sleutel;if(vinkBezig.has(id))return;vinkBezig.add(id);
  try{const rs=cur('afvink').filter(r=>r.soort===soort&&r.dag===dag&&r.sleutel===sleutel);
    if(aan){if(!rs.length)await saveRec('afvink',null,{soort,dag,sleutel,ts:Date.now()})}
    else for(const r of rs)await delRec('afvink',r.id)}
  catch(e){toast('Bewaren lukte niet')}finally{vinkBezig.delete(id)}
}

/* ---------- 2. medicatie geven ---------- */
function medTijd(x){x=String(x).trim();const m=x.match(/^(\d{1,2})\s*(?:[:.hu]\s*(\d{2})?)?\s*(?:uur)?$/i);if(m&&+m[1]<24)return String(+m[1]).padStart(2,'0')+':'+(m[2]||'00');return x.charAt(0).toUpperCase()+x.slice(1)}
const medNodig=s=>/nood|nodig|pijn|koorts|klacht|aanval/i.test(s);
function medSlots(s){const t=String(s||'').trim();if(!t)return ['Tijdstip niet ingevuld'];if(medNodig(t))return ['Indien nodig'];
  return [...new Set(t.split(/\s*(?:,|;|\/|\+|\n|\ben\b)\s*/i).map(medTijd).filter(Boolean))]}
function medVolg(s){if(/^\d\d:\d\d$/.test(s))return s;const l=s.toLowerCase();
  if(l==='indien nodig')return '99';if(l==='tijdstip niet ingevuld')return '98';
  if(/ontbijt|ochtend|morgen|opstaan|nuchter/.test(l))return '08:00';if(/namiddag|vieruur|tussendoor/.test(l))return '16:00';
  if(/middag|lunch/.test(l))return '12:30';if(/avond|diner|souper/.test(l))return '19:00';if(/slapen|bed|nacht/.test(l))return '21:30';
  if(/eten|maaltijd/.test(l))return '12:31';return '97'}
function medrondeView(){
  const d=kampDagOf();const act=new Set(cur('deelnemers').filter(actief).map(p=>p.id));
  const meds=cur('medicatie').filter(r=>act.has(r.deelnemer));const vm=vinkMap('med',d);const groepen={};
  meds.forEach(r=>medSlots(r.momenten).forEach(s=>(groepen[s]=groepen[s]||[]).push(r)));
  const slots=Object.keys(groepen).sort((a,b)=>medVolg(a).localeCompare(medVolg(b))||a.localeCompare(b,'nl'));
  const moet=slots.filter(s=>s!=='Indien nodig').flatMap(s=>groepen[s].map(r=>r.id+'|'+s));const gedaan=moet.filter(x=>vm.has(x)).length;
  const pn=r=>nameOf('deelnemers',r.deelnemer);
  return header('Medicatie geven','')+
  `<p class="hint">Per tijdstip wie wat moet krijgen. Vink af zodra het gegeven is: zo vergeet niemand iets en krijgt niemand iets twee keer. De tijdstippen komen uit de medicatiefiches (veld “Wanneer”, bv. <i>08:00, 20:00</i> of <i>bij het ontbijt</i>).</p>`+dagRij()+
  (meds.length?`<div class="panel xteller${gedaan===moet.length?' vol':''}"><div><b class="num">${gedaan} / ${moet.length}</b> gegeven · ${esc(fdl(d))}</div><div class="xprog"><i style="width:${moet.length?Math.round(gedaan/moet.length*100):100}%"></i></div></div>`+
   slots.map(s=>{const rs=[...groepen[s]].sort((a,b)=>pn(a).localeCompare(pn(b),'nl'));const k=rs.filter(r=>vm.has(r.id+'|'+s)).length;
    return `<div class="panel xslot"><div class="head" style="margin:0 0 8px"><h3 style="margin:0;flex:1">${esc(s)}</h3><span class="lbl">${s==='Indien nodig'?k+' keer gegeven':k+' / '+rs.length}</span></div>
    ${s==='Tijdstip niet ingevuld'?'<p class="hint">Vul bij deze medicatie in wanneer ze genomen moet worden.</p>':''}
    <div class="xlijst">${rs.map(r=>{const p=get('deelnemers',r.deelnemer);const key=r.id+'|'+s;const v=vm.get(key);
     return `<div class="xrijwrap"><button class="xrij${v?' aan':''}" data-xmed="${esc(key)}" aria-pressed="${!!v}"><span class="xbox" aria-hidden="true">${v?'✓':''}</span><span class="xn">${pTag(p)}<b>${esc(p?p.naam:'Onbekend')}</b> · ${esc(r.middel||'')} ${esc(r.dosis||'')}<small>${esc([r.toediening,r.bewaren,r.notities].filter(Boolean).join(' · '))}</small></span><span class="hint">${v?'gegeven om '+tijdVan(v.ts):''}</span></button><button class="btn small" data-edit="medicatie" data-id="${esc(r.id)}" aria-label="Medicatie van ${esc(p?p.naam:'')} wijzigen">✎</button></div>`}).join('')}</div></div>`}).join('')
  :empty('Nog geen medicatie','Vul eerst de medicatiefiches in. Daarna verschijnt hier per tijdstip wie wat moet krijgen.',`<a class="btn primary" href="#medicatie">Naar medicatiefiches</a>`));
}

/* ---------- 4. attesten voor de mutualiteit ---------- */
function attStd(){const r=BRIEF_ADRES.split('\n'),k=K();return {org:r[0]||'',adres:r.slice(1).join(', '),ondnr:'',onderteken:k.verantwoordelijke||'',functie:'kampverantwoordelijke',plaats:(r[r.length-1]||'').replace(/^\d+\s*/,''),
  onderwerp:'Deelnameattest {kamp} – {naam}',mailtekst:'Dag {voornaam},\n\nIn bijlage vind je het deelnameattest van {naam} voor {kamp}. Daarmee kun je bij je mutualiteit een tussenkomst voor het kamp aanvragen.\n\nHeeft je mutualiteit een eigen formulier? Stuur het ons gerust door, dan vullen we het in.\n\nSportieve groeten,\n{ondertekening}'}}

const ATT_VELDEN=[['org','Organisatie'],['adres','Adres organisatie'],['ondnr','Ondernemingsnummer'],['onderteken','Ondertekend door'],['functie','Functie'],['plaats','Opgemaakt te'],['onderwerp','Onderwerp van de mail'],['mailtekst','Tekst van de mail','area']];
const attOntv=()=>cur('deelnemers').filter(actief).sort(byName);
function attGekozen(){kampDagOf();const all=attOntv();return attSel?all.filter(p=>attSel.has(p.id)):all}
function attModel(p){
  const k=K(),c=attCfg(),ds=kampDagen(),loc=briefLoc(briefCfg());
  return {attest:1,org:c.org,adres:c.adres,ondnr:c.ondnr,teken:c.onderteken,functie:c.functie,naam:p.naam,

const KOPIE_DELEN=[['locaties','Locaties en kampplaats',1],['monitoren','Monitoren',0],['kamers','Kamers',1],['ploegen','Groepen (namen en kleuren)',1],['planning','Dagplanning',1],['activiteiten','Activiteiten',1],['maaltijden','Maaltijden',1],['ritten','Fietsritten',1],['taken','Takenlijst (weer op “nog te doen”)',1],['materiaal','Materiaallijst (vinkjes leeg)',1],['contacten','Contacten van dit kamp',1],['kalender','Datums in de kalender',1]];
const isoDag=/^\d{4}-\d{2}-\d{2}$/;
const schuif=(s,n)=>{const d=pd(s);if(!d)return s;d.setDate(d.getDate()+n);return iso(d)};
function kopieOpen(){
  const k=K();if(!k.id)return;const y=pd(k.start);let nStart='';if(y){const d=new Date(y);d.setFullYear(d.getFullYear()+1);nStart=iso(d)}

  <div class="list" style="gap:2px">${KOPIE_DELEN.map(([c,l,aan])=>{const n=tel(c);return `<label class="bed"><span><input type="checkbox" data-kopdeel="${c}" ${aan&&n?'checked':''} ${n?'':'disabled'}> ${esc(l)} <span class="hint" style="margin:0">(${n})</span></span></label>`}).join('')}</div>

async function kopieMaak(){
  const k=K();const naam=($('#kopNaam').value||'').trim();if(!naam){toast('Geef het nieuwe kamp een naam');return}
  const start=$('#kopStart').value;const n=start&&k.start?Math.round((pd(start)-pd(k.start))/864e5):0;
  const delen=[...document.querySelectorAll('[data-kopdeel]:checked')].map(x=>x.dataset.kopdeel);
  const btn=$('#kopGo');btn.disabled=true;btn.textContent='Bezig met kopiëren…';
  const zonderGm=o=>{if(!o||typeof o!=='object')return o;const c={...o};delete c.gemaild;return c};
  const nk={...k};['id','aangemaakt','gewijzigd','voorbeeld','appelExtra'].forEach(x=>delete nk[x]);
  nk.naam=naam;if(k.start)nk.start=schuif(k.start,n);if(k.eind)nk.eind=schuif(k.eind,n);
  ['brief','attest','herinnering'].forEach(x=>{if(nk[x])nk[x]=zonderGm(nk[x])});
  if(k.tussendoor){const t={};Object.entries(k.tussendoor).forEach(([d,v])=>t[isoDag.test(d)?schuif(d,n):d]=v);nk.tussendoor=t}
  try{
    const oud=k.id;const nid=await saveRec('kampen',null,nk);
    const oudIds=new Set(SCOPED.flatMap(c=>data[c].filter(r=>r.kamp===oud).map(r=>r.id)));const kaart=new Map();
    const zet=v=>{if(typeof v==='string'){if(isoDag.test(v))return schuif(v,n);if(kaart.has(v))return kaart.get(v);if(oudIds.has(v))return '';return v}
      if(Array.isArray(v))return v.map(x=>typeof x==='string'&&!isoDag.test(x)&&(kaart.has(x)||oudIds.has(x))?kaart.get(x):zet(x)).filter(x=>x!==undefined&&x!=='');return v};
    const volgorde=['locaties','monitoren','kamers','ploegen','planning','activiteiten','maaltijden','ritten','taken','materiaal','contacten','kalender'].filter(c=>delen.includes(c));
    for(const c of volgorde){
      const rs=SCHEMA[c].global?data[c].filter(r=>r.kamp===oud):data[c].filter(r=>r.kamp===oud);
      for(const r of [...rs]){const o={};for(const [x,v] of Object.entries(r)){if(['id','kamp','aangemaakt','gewijzigd','voorbeeld','gemaild'].includes(x))continue;o[x]=(x==='dagen'&&Array.isArray(v))?v.map(d=>schuif(d,n)):zet(v)}
        if(c==='taken')o.klaar='Nog te doen';if(c==='materiaal'){o.ingepakt=false;o.terug=false}
        if(c==='monitoren'){delete o.kamer}
        const id=await saveRec(c,null,{...o,kamp:nid});kaart.set(r.id,id)}}
    closeForm();setKamp(nid);location.hash='#overzicht';render();toast(naam+' is aangemaakt');
  }catch(e){toast('Kopiëren lukte niet');btn.disabled=false;btn.textContent='Maak het nieuwe kamp'}
}

const EVAL_RUBR=[['algemeen','Algemeen'],['kampplaats','Kampplaats / verblijf'],['eten','Eten'],['activiteiten','Activiteiten'],['begeleiding','Begeleiding'],['organisatie','Organisatie en communicatie']];

function evalVragen(){const k=K();return `Dag,\n\nBedankt dat jullie kind meeging op ${k.naam||'het kamp'}! We willen het volgend jaar nog beter doen en horen graag jullie mening.\n\nMag je kort antwoorden op deze mail?\n\n1. Hoe vond je kind het kamp, op een schaal van 1 tot 5?\n2. Wat vond je kind het leukst?\n3. Wat kan beter (kampplaats, eten, activiteiten, begeleiding, communicatie)?\n4. Komt je kind volgend jaar terug?\n5. Andere opmerkingen of ideeën?\n\nAlvast bedankt!\nDe begeleiding van ${k.naam||'het kamp'}`}

function blogMailTekst(r){const k=K();return [r.titel,r.datum?fdl(r.datum):'','',r.tekst||'','','Groetjes,','De begeleiding van '+(k.naam||'het kamp')].join('\n')}

const blogMailto=r=>`mailto:?bcc=${encodeURIComponent(ouderMails().join(','))}&subject=${encodeURIComponent(blogOnderwerp(r))}&body=${encodeURIComponent(blogMailTekst(r))}`;
async function verklein(blob){
  try{const bm=await createImageBitmap(blob);const sc=Math.min(1,1600/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return await new Promise(res=>c.toBlob(b=>res(b||blob),'image/jpeg',.82))}catch(e){return blob}
}
async function blogFotos(r){
  const media=[...(Array.isArray(r.media)?r.media:[]),...(r.foto&&!isPdf(r.foto)?[r.foto]:[])];const out=[];
  for(const m of media){if(out.length>=12)break;if(/video/.test(m.type||''))continue;const src=phSrc(m);if(!src)continue;
    try{const b=await (await fetch(src)).blob();if(!/^image\//.test(b.type))continue;out.push(await verklein(b))}catch(e){}}
  return out;
}
async function blogMailScript(id){
  const r=get('blog',id);if(!r)return;const bcc=ouderMails();if(!bcc.length){toast('Nog geen e-mailadressen bij de deelnemers');return}

  const delen=[];for(const [i,b] of fotos.entries()){const b64=await blobB64(b);const st=[];for(let j=0;j<b64.length;j+=200000)st.push(b64.slice(j,j+200000));delen.push({naam:`foto-${String(i+1).padStart(2,'0')}.jpg`,st})}
  const scr=`-- S-Sport Recreas: blogbericht "${String(r.titel||'').replace(/[\r\n"]/g,' ')}" als mail naar ${bcc.length} ouders
-- Klik bovenaan dit venster op de knop ▶ (Voer uit).
-- De ouders staan in BCC: ze zien elkaars adres niet. Er wordt niets verstuurd: jij kijkt na en klikt op versturen.

set map to "/tmp/recreas-blog"
do shell script "rm -rf " & quoted form of map & " && mkdir -p " & quoted form of map
set bijlagen to {}
${delen.map(d=>d.st.map(s=>`do shell script "printf %s " & quoted form of ${asStr(s)} & " >> " & quoted form of (map & "/${d.naam}.b64")`).join('\n')+`\ndo shell script "base64 -D -i " & quoted form of (map & "/${d.naam}.b64") & " -o " & quoted form of (map & "/${d.naam}")\nset end of bijlagen to (map & "/${d.naam}")`).join('\n')}
set adressen to {${bcc.map(asStr).join(', ')}}

tell application "Mail"
\tactivate
\tset m to make new outgoing message with properties {subject:${asStr(blogOnderwerp(r))}, content:${asStr(blogMailTekst(r))} & return & return, visible:true}
\trepeat with a in adressen
\t\ttell m to make new bcc recipient at end of bcc recipients with properties {address:(a as text)}
\tend repeat
\trepeat with p in bijlagen
\t\tset f to (POSIX file (p as text)) as alias
\t\ttell content of m to make new attachment with properties {file name:f} at after last paragraph
\tend repeat
end tell
display dialog "De mail staat open in Mail met ${bcc.length} ouders in BCC${fotos.length?' en '+fotos.length+" foto's":''}. Kijk na en klik op versturen." buttons {"OK"} default button 1`;
  const fn='Blog naar ouders - '+veilig(r.titel||'bericht')+'.applescript';

  try{await patchRec('blog',r.id,{gemaildOuders:Date.now()})}catch(e){}
  setTimeout(()=>toast('Open '+fn+' in je map Downloads en klik op ▶'),300);
}

function aandacht(){
  const k=K();if(!k.id)return '';const today=iso(new Date());const ds=kampDagen();const bezig=ds.includes(today);
  const eind=k.eind||k.start;const voor=!!k.start&&today<k.start,na=!!eind&&today>eind;const tot=k.start?Math.round((pd(k.start)-pd(today))/864e5):null;

  const kort=bezig||(tot!=null&&tot>=0&&tot<=14);
  const zn=ps.filter(p=>!p.noodcontact).length;if(zn&&!na)add(kort?'r':'g',mv(zn,'deelnemer','deelnemers')+' zonder noodcontact.','#deelnemers');
  const b=num(k.bijdrage);if(b){const op=ps.filter(p=>num(p.betaald)<b);if(op.length)add(kort?'r':'g',`${mv(op.length,'deelnemer moet','deelnemers moeten')} nog betalen (samen ${eur(op.reduce((s,p)=>s+b-num(p.betaald),0))}).`,'#herinnering')}
  if(voor&&ps.length){const gm=briefGemaild();const n=ps.filter(p=>p.email&&!gm[p.id]).length;if(n)add('g',mv(n,'deelnemer kreeg','deelnemers kregen')+' de uitnodigingsbrief nog niet.','#brief')}
  const zm=ps.filter(p=>!p.email).length;if(zm&&!na)add('g',mv(zm,'deelnemer','deelnemers')+' zonder e-mailadres.','#deelnemers');
  if((voor&&tot!=null&&tot<=10)||bezig){const mat=cur('materiaal');if(!mat.length)add('g','Er is nog geen materiaallijst.','#materiaal');else{const n=mat.filter(r=>!r.ingepakt).length;if(n&&voor)add(tot<=3?'r':'g',mv(n,'ding','dingen')+' nog in te pakken.','#materiaal')}}
  if(bezig){
    const act=new Set(ps.map(p=>p.id)),vm=vinkMap('med',today);
    const moet=cur('medicatie').filter(r=>act.has(r.deelnemer)).flatMap(r=>medSlots(r.momenten).filter(s=>s!=='Indien nodig').map(s=>r.id+'|'+s));
    const open=moet.filter(x=>!vm.has(x)).length;if(open)add('r','Vandaag nog '+mv(open,'keer','keer')+' medicatie te geven.','#medronde');
    if(ps.length&&!cur('afvink').some(r=>r.soort==='appel'&&r.dag===today))add('g','Vandaag is er nog niemand geteld bij Aanwezigheden.','#aanwezig');
  }
  const verz=cur('ongevallen').filter(r=>r.verzekering==='Nog te doen').length;if(verz)add('r',mv(verz,'aangifte','aangiftes')+' bij de verzekering nog te doen.','#ongevallen');
  const ouders=cur('ongevallen').filter(r=>!r.ouders||r.ouders==='Nee').length;if(ouders)add('g',`Bij ${mv(ouders,'voorval','voorvallen')} in het EHBO-logboek zijn de ouders nog niet verwittigd.`,'#ongevallen');
  if(na){
    if(!cur('evaluaties').length)add('g','Het kamp is voorbij: vul de evaluatie in.','#evaluaties');
    const nt=cur('materiaal').filter(r=>r.ingepakt&&!r.terug).length;if(nt)add('r',mv(nt,'ding is','dingen zijn')+' nog niet terug binnengebracht.','#materiaal');
    const ag=(k.attest||{}).gemaild||{};const n=ps.filter(p=>p.email&&!ag[p.id]).length;if(n)add('g',mv(n,'attest','attesten')+' voor de mutualiteit nog niet gemaild.','#attesten');
  }
  L.sort((a,b)=>(a.niv==='r'?0:1)-(b.niv==='r'?0:1));
  return `<section class="panel aandacht"><h3>Wat vraagt aandacht? ${L.length?`<span class="lbl">${L.length}</span>`:''}</h3>${L.length?`<div class="xlijst">${L.map(x=>x.href?`<a class="aitem ${x.niv}" href="${x.href}"><i aria-hidden="true"></i><span>${esc(x.t)}</span><span class="pijl" aria-hidden="true">›</span></a>`:`<div class="aitem ${x.niv}"><i aria-hidden="true"></i><span>${esc(x.t)}</span>${x.knop}</div>`).join('')}</div>`:'<p class="hint" style="margin:0">Alles in orde ✓ Er is niets dat dringend aandacht vraagt.</p>'}</section>`;
}


/* ===================== synchroniseren tussen toestellen (losse versie, zonder server) =====================
   Elk toestel schrijft zijn eigen bestand recreas-sync-<toestel>.json in een gedeelde map (iCloud Drive, Dropbox,
   OneDrive, Google Drive). Foto's staan ernaast als media-<sleutel>. Elk toestel leest de bestanden van de anderen
   en voegt samen: per record wint de laatste wijziging; verwijderen wordt onthouden. */
var WEG={},toestel=null,syncMap=null,syncStatus='',syncBezig=false,syncLaatst=0,syncGezien={},syncAndere={},schrijfNodig=true,syncT=0,syncWacht=false,installEvt=null;
const SYNC_AAN=STANDALONE;
const MAP_OK=SYNC_AAN&&typeof window.showDirectoryPicker==='function';
const eigenBestand=()=>'recreas-sync-'+(toestel?toestel.id:'x')+'.json';
const tsv=r=>r?(r.gewijzigd||r.aangemaakt||0):0;
function noteerWeg(col,id){(WEG[col]=WEG[col]||{})[id]=Date.now();idbDo('kv','readwrite',st=>st.put(WEG,'weg')).catch(()=>{})}
function syncPlan(){if(!SYNC_AAN)return;schrijfNodig=true;clearTimeout(syncT);if(syncMap)syncT=setTimeout(()=>syncNu(false),4000)}
async function syncLaad(){
  if(!SYNC_AAN)return;
  try{WEG=(await idbDo('kv','readonly',st=>st.get('weg')))||{}}catch(e){}
  try{toestel=await idbDo('kv','readonly',st=>st.get('toestel'))}catch(e){}
  if(!toestel||!toestel.id){toestel={id:uid(),naam:''};idbDo('kv','readwrite',st=>st.put(toestel,'toestel')).catch(()=>{})}
  try{syncAndere=(await idbDo('kv','readonly',st=>st.get('andere')))||{}}catch(e){}
  if(MAP_OK){try{syncMap=(await idbDo('kv','readonly',st=>st.get('map')))||null}catch(e){}}
}
function syncNaStart(){
  if(!syncMap)return;
  mapToestemming(false).then(ok=>{if(ok)syncNu(false);else{syncStatus='toestemming';setSync('err','Klik om te synchroniseren');scheduleRender()}});
}
const aanHetTypen=()=>{const a=document.activeElement;return !!a&&a.closest&&a.closest('#main')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
function zoekMedia(o,m){if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(x=>zoekMedia(x,m));return}
  if(typeof o.idb==='string')m.set(o.idb,o.type||'');for(const v of Object.values(o))if(v&&typeof v==='object')zoekMedia(v,m)}
/* gegevens van een ander toestel samenvoegen met wat hier staat */
async function syncMerge(o,mediaBron){
  if(!o||o.app!=='recreas-kampen'||!o.data)throw new Error('geen syncbestand');
  let nieuw=0,weg=0;const nodig=new Map();
  for(const col of COLS){const rs=o.data[col];if(!Array.isArray(rs))continue;const wl=WEG[col]||{};
    for(const r of rs){if(!r||!r.id)continue;if(wl[r.id]&&wl[r.id]>=tsv(r))continue;
      const i=data[col].findIndex(x=>x.id===r.id);
      if(i<0){data[col].push(r);nieuw++}else if(tsv(r)>tsv(data[col][i])){data[col][i]=r;nieuw++}else continue;
      zoekMedia(r,nodig)}}
  for(const [col,m] of Object.entries(o.weg||{})){if(!data[col]||!m)continue;WEG[col]=WEG[col]||{};
    for(const [id,ts] of Object.entries(m)){if((WEG[col][id]||0)<ts)WEG[col][id]=ts;
      const i=data[col].findIndex(x=>x.id===id);if(i>=0&&tsv(data[col][i])<=ts){data[col].splice(i,1);weg++}}}
  for(const [key,type] of nodig){if(MEDIA[key])continue;
    try{let b=await mediaBron(key);if(!b)continue;if(type&&b.type!==type)b=new Blob([b],{type});
      await idbDo('media','readwrite',st=>st.put(b,key));MEDIA[key]=URL.createObjectURL(b)}catch(e){}}
  idbDo('kv','readwrite',st=>st.put(WEG,'weg')).catch(()=>{});
  if(nieuw||weg){lsSet();schrijfNodig=true;if(aanHetTypen())syncWacht=true;else scheduleRender()}
  return {nieuw,weg};
}
function syncSnap(media){return {app:'recreas-kampen',soort:'sync',versie:1,toestel:{id:toestel.id,naam:toestel.naam||''},tijd:Date.now(),data,weg:WEG,...(media?{media}:{})}}
const dataUrlBlob=async u=>await (await fetch(u)).blob();
function noteerAnder(o){if(o&&o.toestel&&o.toestel.id&&o.toestel.id!==toestel.id){syncAndere[o.toestel.id]={naam:o.toestel.naam||'',tijd:o.tijd||0};idbDo('kv','readwrite',st=>st.put(syncAndere,'andere')).catch(()=>{})}}

/* ---------- gedeelde map (Chrome en Edge op computer) ---------- */
async function mapToestemming(vraag){
  if(!syncMap)return false;if(typeof syncMap.queryPermission!=='function')return true;const o={mode:'readwrite'};
  try{if(await syncMap.queryPermission(o)==='granted')return true;if(vraag&&await syncMap.requestPermission(o)==='granted')return true}catch(e){}
  return false;
}
async function mapKies(){
  try{const h=await window.showDirectoryPicker({id:'recreas-sync',mode:'readwrite'});syncMap=h;syncGezien={};
    await idbDo('kv','readwrite',st=>st.put(h,'map'));schrijfNodig=true;await syncNu(true);render()}
  catch(e){if(!e||e.name!=='AbortError')toast('Map kiezen lukte niet')}
}
async function mapStop(){syncMap=null;syncStatus='';syncGezien={};try{await idbDo('kv','readwrite',st=>st.delete('map'))}catch(e){}setSync('ok','Op dit toestel');render()}
async function mapSchrijf(bestaand){
  const ws=async(naam,inh)=>{const fh=await syncMap.getFileHandle(naam,{create:true});const w=await fh.createWritable();await w.write(inh);await w.close()};
  for(const [k,blob] of await idbAll('media')){if(!bestaand.has('media-'+k))await ws('media-'+k,blob)}
  if(schrijfNodig||!bestaand.has(eigenBestand())){await ws(eigenBestand(),JSON.stringify(syncSnap()));schrijfNodig=false}
}
async function syncNu(vraag){
  if(!syncMap||syncBezig)return;
  if(!await mapToestemming(vraag)){syncStatus='toestemming';setSync('err','Klik om te synchroniseren');scheduleRender();return}
  syncBezig=true;setSync('ok','Synchroniseren…');let nieuw=0,weg=0,ok=true;
  try{
    const bestaand=new Set(),andere=[];
    for await (const [naam,h] of syncMap.entries()){bestaand.add(naam);if(h.kind==='file'&&/^recreas-sync-.+\.json$/.test(naam)&&naam!==eigenBestand())andere.push(h)}
    for(const h of andere){const f=await h.getFile();if(syncGezien[h.name]===f.lastModified)continue;
      try{const o=JSON.parse(await f.text());noteerAnder(o);
        const r=await syncMerge(o,async key=>{if(o.media&&o.media[key])return dataUrlBlob(o.media[key]);try{return await (await syncMap.getFileHandle('media-'+key)).getFile()}catch(e){return null}});
        nieuw+=r.nieuw;weg+=r.weg;syncGezien[h.name]=f.lastModified}catch(e){}}
    await mapSchrijf(bestaand);syncLaatst=Date.now();syncStatus='ok';
  }catch(e){ok=false;syncStatus='fout'}
  syncBezig=false;
  setSync(ok?'ok':'err',ok?'Gesynchroniseerd '+tijdVan(syncLaatst):'Map niet bereikbaar');
  if(nieuw||weg)toast(`Gesynchroniseerd: ${nieuw} nieuw of gewijzigd${weg?', '+weg+' verwijderd':''}`);
  const p=document.getElementById('syncInfo');if(p)p.innerHTML=syncInfoHTML();
}
if(SYNC_AAN){
  setInterval(()=>{if(syncMap&&syncStatus==='ok'&&document.visibilityState==='visible')syncNu(false)},45000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syncMap&&syncStatus==='ok')syncNu(false)});
  window.addEventListener('online',()=>{if(syncMap&&syncStatus==='ok')syncNu(false)});
  document.addEventListener('focusout',()=>setTimeout(()=>{if(syncWacht&&!aanHetTypen()){syncWacht=false;render()}},50));
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;scheduleRender()});
  window.addEventListener('appinstalled',()=>{installEvt=null;toast('De app staat nu op deze computer');scheduleRender()});
}

/* ---------- sync-bestand (Safari, iPhone, iPad, Android) ---------- */
async function bestandBewaar(){
  toast('Bestand wordt gemaakt…');const media={};
  try{for(const [k,blob] of await idbAll('media'))media[k]=await blobToDataURL(blob)}catch(e){}
  const file=new File([JSON.stringify(syncSnap(media))],eigenBestand(),{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Recreas sync'});return}catch(e){if(e&&e.name==='AbortError')return}}
  saveFile(file.name,file);setTimeout(()=>toast('Zet '+file.name+' in de gedeelde map'),300);
}
async function bestandLees(files){
  const fs=[...files];const media={};fs.forEach(f=>{const m=f.name.match(/^media-(.+)$/);if(m)media[m[1]]=f});
  let nieuw=0,weg=0,n=0;
  for(const f of fs){if(!/\.json$/i.test(f.name)||f.name===eigenBestand())continue;
    try{const o=JSON.parse(await f.text());if(o.app!=='recreas-kampen')continue;noteerAnder(o);
      const r=await syncMerge(o,async key=>o.media&&o.media[key]?dataUrlBlob(o.media[key]):(media[key]||null));nieuw+=r.nieuw;weg+=r.weg;n++}catch(e){}}
  toast(n?`${n} bestand${n===1?'':'en'} samengevoegd: ${nieuw} nieuw of gewijzigd${weg?', '+weg+' verwijderd':''}`:'Geen syncbestanden van andere toestellen gevonden');render();
}

document.addEventListener('click',async e=>{

async function shrink(file){

}

  if(t.dataset.brieffiche){const k=K();if(!k.id)return;try{await patchRec('kampen',k.id,{brief:{...(k.brief||{}),fiche:t.checked?'':'nee'}})}catch(err){toast('Bewaren lukte niet')}return}
  if(t.dataset.briefalg){briefAlg=t.checked;render();return}
  if(t.dataset.ploegset){try{await patchRec('deelnemers',t.dataset.ploegset,{ploeg:t.value})}catch(err){toast('Groep wijzigen lukte niet')}return}
  if(t.id==='kampSel'){if(t.value==='__new'){t.value=curKamp;openForm('kampen');return}setKamp(t.value);render();return}
  if(t.dataset.assign){try{await patchRec(t.dataset.pcol||'deelnemers',t.dataset.assign,{kamer:t.value})}catch(err){toast('Kamer wijzigen lukte niet')}return}
  if((t.id==='scanIn'||t.id==='scanPick')&&t.files[0]){
    if(!K().id){toast('Kies eerst een kamp');return}
    const f=t.files[0];t.value='';toast('Rekening wordt opgeladen…');
    try{const {ph,blob}=await upload(f);openForm('boekhouding',null,{soort:'Uitgave',datum:sampleFn?'':iso(new Date()),bon:ph,_blob:blob})}catch(err){toast(err&&err.message?err.message:'Opladen lukte niet')}return}
  if(t.id==='restoreIn'&&t.files[0]){const f=t.files[0];t.value='';readBackup(f);return}
  if(t.id==='prijsKamp'){const k=K();if(!k.id)return;try{await patchRec('kampen',k.id,{bijdrage:t.value.trim()===''?'':num(t.value)});toast('Prijs kamp bewaard')}catch(err){toast('Prijs bewaren lukte niet')}return}
  if(t.classList.contains('bud')){const k=K();if(!k.id)return;const b={...(k.begroting||{})};const v=num(t.value);if(v)b[t.dataset.cat]=v;else delete b[t.dataset.cat];
    try{await patchRec('kampen',k.id,{begroting:b})}catch(err){toast('Begroting bewaren lukte niet')}return}
  if(t.id==='f_categorie'&&form)form.catAuto=false;
  if(t.id==='f_categorie'&&t.value){const s=$('#f_soort');if(s)s.value=catGroup(t.value)==='Opbrengsten'?'Inkomst':'Uitgave';return}
  if(t.id==='mediaIn'&&t.files.length){
    const files=[...t.files];t.value='';const say=s=>{const m=$('#mediaMsg');if(m)m.textContent=s};
    for(let i=0;i<files.length;i++){say(`Opladen ${i+1} van ${files.length}…`);try{const {ph}=await upload(files[i]);if(!form)return;form.media.push(ph);form.newMedia.push(ph);mediaBox()}catch(err){say(err&&err.message?err.message:'Opladen lukte niet');return}}
    say('');return}
  if(t.id==='chatMedia'&&t.files[0]){const f=t.files[0];t.value='';toast('Opladen…');try{const {ph}=await upload(f);await sendChat(ph)}catch(err){toast(err&&err.message?err.message:'Opladen lukte niet')}return}
  if(t.id==='phIn'&&t.files[0]){
    const f=t.files[0];t.value='';const m=$('#aiMsg');if(m)m.textContent='Opladen…';
    try{const {ph,blob}=await upload(f);if(form.ph)form.removed.push(form.ph);form.ph=ph;form.blob=blob;form.uploadedNew=true;photoBox();if(form.col==='boekhouding')readBon(blob)}catch(err){const m2=$('#aiMsg');if(m2)m2.textContent=err&&err.message?err.message:'Opladen lukte niet'}}
});
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('.sheet.groot textarea'))groei(e.target);
  if(e.target.id==='f_omschrijving'&&form&&form.col==='boekhouding'){const c=$('#f_categorie'),s=$('#f_soort');if(c&&(!c.value||form.catAuto)&&(!s||s.value!=='Inkomst')){const g=guessCat(e.target.value);if(g){c.value=g;form.catAuto=true}else if(form.catAuto){c.value='';}}}if(e.target.classList.contains('keep'))drafts[e.target.id]=e.target.value;
  if(e.target.id==='chatInput')document.querySelectorAll('[data-wabase]').forEach(a=>a.href=a.dataset.wabase+encodeURIComponent(e.target.value));if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#veil'))closeForm()});
document.addEventListener('mousedown',e=>{if(e.target.id==='veil')closeForm()});

async function exportCsv(){
  const rows=[['Kamp','Datum','Soort','Omschrijving','Categorie','Bedrag','Betaald door','Betaalwijze','Rekening','Notities']];const kn=K().naam||'';
  cur('boekhouding').sort((a,b)=>(a.datum||'').localeCompare(b.datum||'')).forEach(r=>rows.push([kn,r.datum||'',r.soort||'',r.omschrijving||'',r.categorie||'',(r.soort==='Inkomst'?1:-1)*num(r.bedrag),r.betaaldDoor||'',r.betaalwijze||'',r.bon?'ja':'nee',r.notities||'']));
  cur('deelnemers').filter(r=>num(r.betaald)).forEach(r=>rows.push([kn,'','Inkomst','Prijs kamp '+r.naam,'Prijs kamp',num(r.betaald),r.naam,'','','']));
  const csv='﻿'+rows.map(r=>r.map(v=>{const s=typeof v==='number'?v.toFixed(2).replace('.',','):String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\n');
  const fn='boekhouding-'+(kn||'kamp').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv';
  if(downloads){try{await downloads.save({filename:fn,data:new Blob([csv],{type:'text/csv'})});return}catch(err){if(err&&err.code==='declined')return}}
  if(STANDALONE){saveFile(fn,new Blob([csv],{type:'text/csv'}));return}
  try{await navigator.clipboard.writeText(csv);toast('CSV gekopieerd: plak in Excel')}catch(err){toast('Exporteren lukt hier niet')}
}

route();boot();
</script>
